name: Release — Binary Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  # =========================================================================
  # 1. Tag, create GitHub Release
  # =========================================================================
  release:
    needs: ci-gate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Read version from source
        id: bump_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Write VERSION file
        run: echo "${{ steps.bump_version.outputs.new_version }}" > VERSION

      - name: Fetch latest PR info
        id: fetch_pr
        uses: actions/github-script@v6
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'closed', base: 'main',
              sort: 'updated', direction: 'desc', per_page: 1,
            });
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              return {
                title: pr.title,
                body: (pr.body || 'No description provided').replace(/\r\n/g, '\n'),
                number: pr.number,
                url: pr.html_url,
                author: pr.user.login,
              };
            }
            return null;

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Mapanare v${{ steps.bump_version.outputs.new_version }}
          body: |
            > AI-native compiled language. First-class agents, signals, streams, tensors.
            > Compiles to LLVM IR, C, and WebAssembly. **~168x faster than Python.**

            ---

            ## What's New

            ${{ steps.fetch_pr.outputs.result != 'null' && fromJSON(steps.fetch_pr.outputs.result).body || 'See commit history for details.' }}

            ---

            ## Downloads

            | Platform | Full CLI | Native Compiler |
            |:---------|:--------:|:---------------:|
            | **Linux** x86_64 | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-linux-x64.tar.gz) | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mnc-linux-x64) |
            | **macOS** Apple Silicon | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-mac-arm64.tar.gz) | Build from source ([instructions](https://github.com/${{ github.repository }}#building-from-source)) |
            | **macOS** Intel | — | Build from source ([instructions](https://github.com/${{ github.repository }}#building-from-source)) |
            | **Windows** x86_64 | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-win-x64.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mnc-win-x64.exe) |

            > **Full CLI** includes the compiler, Python transpiler, LSP, and WASM backend.
            > **Native Compiler** is a single ~3 MB binary with no dependencies.
            >
            > [SHA256 Checksums](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/SHA256SUMS.txt)

            ---

            ## Quick Install

            **Linux / macOS:**
            ```bash
            curl -fsSL https://mapanare.dev/install | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://mapanare.dev/install.ps1 | iex
            ```

            **pip:**
            ```bash
            pip install mapanare
            ```

            **Verify:**
            ```bash
            mapanare --version
            ```

            ---

            ## Write Python, Compile Native

            ```bash
            mapanare build your_script.py -o your_script
            ./your_script   # 33-239x faster
            ```

            See [Python to Native guide](https://github.com/${{ github.repository }}/blob/main/docs/guides/python_to_native.md) for supported features.

            ---

            <details>
            <summary>Release details</summary>

            - Version: `v${{ steps.bump_version.outputs.new_version }}`
            - Commit: `${{ github.sha }}`
            ${{ steps.fetch_pr.outputs.result != 'null' && format('- PR: #{0} by @{1}', fromJSON(steps.fetch_pr.outputs.result).number, fromJSON(steps.fetch_pr.outputs.result).author) || '' }}
            </details>
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

  # =========================================================================
  # 2. Publish to PyPI
  # =========================================================================
  publish-pypi:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set version and build
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # =========================================================================
  # 3. Build CLI binary with PyInstaller (3 platforms)
  # =========================================================================

  build-cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mapanare-linux-x64
            archive_name: mapanare-linux-x64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            artifact: mapanare-mac-arm64
            archive_name: mapanare-mac-arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            artifact: mapanare-win-x64
            archive_name: mapanare-win-x64.zip
            archive_cmd: 7z a

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Mapanare + PyInstaller
        shell: bash
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install -e .
          pip install pyinstaller

      - name: Clean __pycache__
        shell: bash
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build native runtime
        shell: bash
        run: python runtime/native/build_native.py || echo "Native runtime build skipped (optional)"

      # -------------------------------------------------------------------
      # Windows only: vendor a portable MinGW toolchain (w64devkit) into
      # the PyInstaller bundle so `mapanare run` / `mapanare build` work
      # out of the box without a system gcc/clang. Pre-build
      # libmapanare_rt.a with that same toolchain so users don't pay the
      # runtime-compile cost on every invocation.
      # -------------------------------------------------------------------
      - name: Stage portable toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          W64DEVKIT_VERSION: "2.7.0"
        run: |
          set -euo pipefail
          url="https://github.com/skeeto/w64devkit/releases/download/v${W64DEVKIT_VERSION}/w64devkit-x64-${W64DEVKIT_VERSION}.7z.exe"
          mkdir -p .tmp-tc && cd .tmp-tc
          curl -fL -o w64devkit.exe "$url"
          # SFX 7z archive: -y auto-confirm, -o extract dir
          ./w64devkit.exe -y -o.
          mv w64devkit ../toolchain
          cd ..
          ls toolchain/bin/gcc.exe
          ./toolchain/bin/gcc.exe --version

      - name: Pre-build Windows runtime archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchain/bin:$PATH"
          mkdir -p toolchain/lib
          cd runtime/native
          gcc -c -O2 -I. mapanare_core.c   -o mapanare_rt_mapanare_core.o
          gcc -c -O2 -I. mapanare_db.c     -o mapanare_rt_mapanare_db.o
          gcc -c -O2 -I. mapanare_io.c     -o mapanare_rt_mapanare_io.o
          gcc -c -O2 -I. mapanare_html.c   -o mapanare_rt_mapanare_html.o
          gcc -c -O2 -I. mapanare_runtime.c -o mapanare_rt_mapanare_runtime.o
          gcc -c -O2 -I. mapanare_gpu.c    -o mapanare_rt_mapanare_gpu.o
          gcc -c -O2 -I. mapanare_gpu_builtins.c -o mapanare_rt_mapanare_gpu_builtins.o
          ar rcs ../../toolchain/lib/libmapanare_rt.a \
            mapanare_rt_*.o
          rm -f mapanare_rt_*.o
          ls -la ../../toolchain/lib/

      - name: Build CLI binary
        run: pyinstaller packaging/mapanare.spec --clean

      - name: Smoke test CLI binary
        shell: bash
        run: |
          BINARY="./dist/mapanare/mapanare"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINARY="./dist/mapanare/mapanare.exe"
          fi
          "$BINARY" --version
          "$BINARY" --help
          # On Windows, exercise the full compile+run path with the bundled
          # toolchain so a broken release fails CI instead of end users.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo 'fn main() { print("hello from smoke test") }' > smoke.mn
            "$BINARY" run smoke.mn
            "$BINARY" build smoke.mn -o smoke.exe
            ./smoke.exe
          fi
          echo "CLI smoke test passed"

      - name: Archive CLI binary
        shell: bash
        run: |
          cd dist
          ${{ matrix.archive_cmd }} "${{ matrix.archive_name }}" mapanare/

      - name: Upload CLI archive to GitHub Release
        shell: bash
        run: |
          gh release upload "v${{ needs.release.outputs.new_version }}" \
            "dist/${{ matrix.archive_name }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. Build native compiler binary (mnc) — small, no Python dependency
  # =========================================================================
  build-native:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mnc-linux-x64
            triple: x86_64-linux-gnu
          - os: windows-latest
            artifact: mnc-win-x64.exe
            triple: x86_64-w64-mingw32

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Mapanare + LLVM
        shell: bash
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install -e .
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y llvm-18 clang-18
            echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm@18
            echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          fi

      # -------------------------------------------------------------------
      # Windows only: vendor a portable MinGW toolchain (w64devkit) so the
      # Windows native-compiler job has gcc/clang without installing LLVM
      # system-wide. Mirrors the build-cli job's toolchain staging.
      # -------------------------------------------------------------------
      - name: Stage portable toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          W64DEVKIT_VERSION: "2.7.0"
        run: |
          set -euo pipefail
          url="https://github.com/skeeto/w64devkit/releases/download/v${W64DEVKIT_VERSION}/w64devkit-x64-${W64DEVKIT_VERSION}.7z.exe"
          mkdir -p .tmp-tc && cd .tmp-tc
          curl -fL -o w64devkit.exe "$url"
          ./w64devkit.exe -y -o.
          mv w64devkit ../toolchain
          cd ..
          ls toolchain/bin/gcc.exe
          ./toolchain/bin/gcc.exe --version

      - name: Build mnc-stage1 via Python
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python scripts/build_stage1.py
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # scripts/build_stage1.py has full Windows support since v4.159.0
            # (MinGW triple, -mno-stack-arg-probe, __chkstk=___chkstk_ms alias,
            # -Wl,--stack,67108864, POSIX-module skip list). It just needs
            # gcc + clang on PATH — the bundled w64devkit provides both.
            export PATH="$PWD/toolchain/bin:$PATH"
            gcc --version
            clang --version
            python scripts/build_stage1.py
            cp mapanare/self/mnc-stage1.exe "${{ matrix.artifact }}"
            ls -la "${{ matrix.artifact }}"
          else
            python scripts/build_stage1.py
          fi

      - name: Self-compile to stage2 (native binary)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # v5.8.4 Wb.2 closed: the self-hosted emit_llvm.mn is now
            # target-aware. mnc-stage1.exe on Windows emits Win64
            # sret-style aggregate-return declarations and call sites
            # for the ~37 runtime fns that previously diverged from
            # gcc's Win64 C ABI. Self-compile-to-stage2 cycle re-enabled.
            export PATH="$PWD/toolchain/bin:$PATH"
            # Wb.1.dx instrumentation (paid forward from v5.8.3 PROMPT
            # Phase 4): if any step crashes, capture a backtrace before
            # the job exits so we don't have to re-trigger CI to
            # diagnose. Cheap; no-op on success.
            set +e
            ./mapanare/self/mnc-stage1.exe mapanare/self/mnc_all.mn > stage2.ll
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "=== Wb.1.dx: mnc-stage1.exe exited $rc; capturing diagnostics ==="
              if command -v gdb >/dev/null; then
                gdb -batch \
                  -ex 'set args mapanare/self/mnc_all.mn' \
                  -ex 'run' -ex 'bt 30' \
                  ./mapanare/self/mnc-stage1.exe || true
              fi
              exit $rc
            fi
            clang --target=x86_64-w64-mingw32 -c -O2 -mno-stack-arg-probe \
              stage2.ll -o stage2.o
            # Stage2 self-compile of mnc_all.mn needs a generous stack
            # because the self-hosted compiler's recursive descent path
            # plus the v5.8.4 sarg/sret allocas push beyond the v5.8.2
            # 64 MB cushion. 256 MB is the next power-of-two and matches
            # what we verified locally.
            gcc -O2 stage2.o \
              runtime/native/mapanare_core.c \
              runtime/native/mapanare_runtime.c \
              runtime/native/mapanare_gpu.c \
              runtime/native/mapanare_gpu_builtins.c \
              mapanare/self/mnc_main.c \
              -I runtime/native \
              -o "${{ matrix.artifact }}" \
              -lm \
              -Wl,--stack,268435456 \
              -Wl,--defsym=__chkstk=___chkstk_ms
            ls -la "${{ matrix.artifact }}"
            # Strip in place to keep the artifact small for releases.
            ./toolchain/bin/strip.exe "${{ matrix.artifact }}" || true
            # Wb.1.dx wrap for the stage2 binary running mnc_all.mn —
            # this is where Wb.2 used to manifest as a hard SIGSEGV.
            set +e
            ./"${{ matrix.artifact }}" mapanare/self/mnc_all.mn > stage3.ll
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "=== Wb.1.dx: mnc-stage2 exited $rc; capturing diagnostics ==="
              if command -v gdb >/dev/null; then
                gdb -batch -ex run -ex 'bt 30' \
                  --args ./"${{ matrix.artifact }}" mapanare/self/mnc_all.mn || true
              fi
              exit $rc
            fi
            # Fixed-point gate. The non-VERSION drift threshold mirrors
            # the Linux/macOS Dr.1 baseline: a strict 4-line VERSION-
            # only diff would be best, but until the self-hosted
            # compiler substitutes __MN_VERSION__ we tolerate up to 10
            # lines (same threshold the v5.8.4 PLAN exit criterion
            # uses).
            diff_count=$(diff stage2.ll stage3.ll | grep -c '^[<>]' || true)
            echo "Windows fixed-point diff: $diff_count lines"
            if [[ $diff_count -gt 10 ]]; then
              echo "FATAL: Windows fixed-point drift > 10 lines"
              diff stage2.ll stage3.ll | head -40 || true
              exit 1
            fi
            echo "Windows fixed point OK (<= 10-line VERSION-only drift)"
          else
            ./mapanare/self/mnc-stage1 mapanare/self/mnc_all.mn > /tmp/stage2.ll
            clang -c -O2 /tmp/stage2.ll -o /tmp/stage2.o
            clang -O2 /tmp/stage2.o \
              runtime/native/mapanare_core.c \
              runtime/native/mapanare_io.c \
              runtime/native/mapanare_runtime.c \
              runtime/native/mapanare_gpu.c \
              runtime/native/mapanare_gpu_builtins.c \
              mapanare/self/mnc_main.c \
              -I runtime/native \
              -o "${{ matrix.artifact }}" \
              -lm -lpthread -ldl \
              -Wl,-z,stack-size=67108864 2>/dev/null \
              || clang -O2 /tmp/stage2.o \
                runtime/native/mapanare_core.c \
                runtime/native/mapanare_io.c \
                runtime/native/mapanare_runtime.c \
                runtime/native/mapanare_gpu.c \
                runtime/native/mapanare_gpu_builtins.c \
                mapanare/self/mnc_main.c \
                -I runtime/native \
                -o "${{ matrix.artifact }}" \
                -lm -lpthread -ldl
          fi

      - name: Smoke test native binary
        shell: bash
        run: |
          if [[ -f "${{ matrix.artifact }}" ]]; then
            ./${{ matrix.artifact }} --version
            # Compile a trivial .mn end-to-end to catch any missing-symbol
            # link errors the --version path alone wouldn't exercise.
            echo 'fn main() { print("hello from mnc smoke") }' > mnc_smoke.mn
            ./${{ matrix.artifact }} mnc_smoke.mn > mnc_smoke.ll
            head -5 mnc_smoke.ll
            rm -f mnc_smoke.mn mnc_smoke.ll
            echo "Native binary smoke test passed"
          else
            echo "No native binary produced (platform may not support it)"
          fi

      - name: Upload native binary to release
        shell: bash
        run: |
          if [[ -f "${{ matrix.artifact }}" ]]; then
            gh release upload "v${{ needs.release.outputs.new_version }}" \
              "${{ matrix.artifact }}" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 5. Generate SHA256 checksums for all release artifacts
  # =========================================================================
  checksums:
    needs: [release, build-cli, build-native]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release assets
        shell: bash
        run: |
          gh release download "v${{ needs.release.outputs.new_version }}" \
            -D /tmp/assets -R "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd /tmp/assets
          if ls * 1>/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            echo "=== SHA256SUMS.txt ==="
            cat SHA256SUMS.txt
          else
            echo "No assets found"
          fi

      - name: Upload checksums to release
        shell: bash
        run: |
          if [[ -f /tmp/assets/SHA256SUMS.txt ]]; then
            gh release upload "v${{ needs.release.outputs.new_version }}" \
              /tmp/assets/SHA256SUMS.txt --clobber \
              -R "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 6. Update release body with actual asset sizes
  # =========================================================================
  update-release:
    needs: [release, build-cli, build-native, checksums]
    runs-on: ubuntu-latest

    steps:
      - name: Update release body with asset sizes
        uses: actions/github-script@v6
        with:
          script: |
            const version = '${{ needs.release.outputs.new_version }}';
            const releaseId = ${{ needs.release.outputs.release_id }};

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const sizeMap = {};
            for (const asset of release.data.assets) {
              const bytes = asset.size;
              let size;
              if (bytes >= 1024 * 1024 * 1024) {
                size = (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
              } else if (bytes >= 1024 * 1024) {
                size = (bytes / (1024 * 1024)).toFixed(1) + ' MB';
              } else if (bytes >= 1024) {
                size = (bytes / 1024).toFixed(1) + ' KB';
              } else {
                size = bytes + ' B';
              }
              sizeMap[asset.name] = size;
            }

            let body = release.data.body;
            for (const [name, size] of Object.entries(sizeMap)) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`(\\[` + '`' + escaped + '`' + `\\][^|]+\\|)\\s*—\\s*\\|`);
              body = body.replace(pattern, `$1 ${size} |`);
            }

            body = body.replace(/\n> Downloads become available[^\n]*\n?/, '\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: body,
            });
