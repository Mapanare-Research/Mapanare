name: Release — Binary Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  # =========================================================================
  # 1. Tag, create GitHub Release
  # =========================================================================
  release:
    needs: ci-gate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Read version from source
        id: bump_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Write VERSION file
        run: echo "${{ steps.bump_version.outputs.new_version }}" > VERSION

      - name: Fetch latest PR info
        id: fetch_pr
        uses: actions/github-script@v6
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'closed', base: 'main',
              sort: 'updated', direction: 'desc', per_page: 1,
            });
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              return {
                title: pr.title,
                body: (pr.body || 'No description provided').replace(/\r\n/g, '\n'),
                number: pr.number,
                url: pr.html_url,
                author: pr.user.login,
              };
            }
            return null;

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Mapanare v${{ steps.bump_version.outputs.new_version }}
          body: |
            > AI-native compiled language. First-class agents, signals, streams, tensors.
            > Compiles to LLVM IR, C, and WebAssembly. **~168x faster than Python.**

            ---

            ## What's New

            ${{ steps.fetch_pr.outputs.result != 'null' && fromJSON(steps.fetch_pr.outputs.result).body || 'See commit history for details.' }}

            ---

            ## Downloads

            | Platform | Full CLI | Native Compiler |
            |:---------|:--------:|:---------------:|
            | **Linux** x86_64 | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz) | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mnc-${{ steps.bump_version.outputs.new_version }}-linux-x64) |
            | **macOS** Apple Silicon | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-${{ steps.bump_version.outputs.new_version }}-mac-arm64.tar.gz) | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mnc-${{ steps.bump_version.outputs.new_version }}-darwin-arm64) |
            | **macOS** Intel | — | Build from source ([instructions](https://github.com/${{ github.repository }}#building-from-source)) |
            | **Windows** x86_64 | [SDK](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-${{ steps.bump_version.outputs.new_version }}-win-x64-sdk.zip) · [Minimal](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mapanare-${{ steps.bump_version.outputs.new_version }}-win-x64-minimal.zip) | [Download](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/mnc-${{ steps.bump_version.outputs.new_version }}-win-x64.exe) |

            > **Full CLI** includes the compiler, Python transpiler, LSP, and WASM backend.
            > **Native Compiler** is a single ~3 MB binary with no dependencies.
            >
            > **Windows users:** the default SDK download bundles a curated LLVM-MinGW/UCRT compiler SDK so `mnc run` and `mnc build` work with zero external installs. Power users with their own compiler can use the **Minimal** variant (set `MAPANARE_NO_BUNDLED_TOOLCHAIN=1` or the legacy `MAPANARE_NO_BUNDLED_LLVM=1` before `install.ps1` to download it automatically).
            >
            > [SHA256 Checksums](https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump_version.outputs.new_version }}/SHA256SUMS.txt)

            ---

            ## Quick Install

            **Linux / macOS:**
            ```bash
            curl -fsSL https://mapanare.dev/install | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://mapanare.dev/install.ps1 | iex
            ```

            **pip:**
            ```bash
            pip install mapanare
            ```

            **Verify:**
            ```bash
            mapanare --version
            ```

            ---

            ## Write Python, Compile Native

            ```bash
            mapanare build your_script.py -o your_script
            ./your_script   # 33-239x faster
            ```

            See [Python to Native guide](https://github.com/${{ github.repository }}/blob/main/docs/guides/python_to_native.md) for supported features.

            ---

            <details>
            <summary>Release details</summary>

            - Version: `v${{ steps.bump_version.outputs.new_version }}`
            - Commit: `${{ github.sha }}`
            ${{ steps.fetch_pr.outputs.result != 'null' && format('- PR: #{0} by @{1}', fromJSON(steps.fetch_pr.outputs.result).number, fromJSON(steps.fetch_pr.outputs.result).author) || '' }}
            </details>
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

  # =========================================================================
  # 2. Publish to PyPI
  # =========================================================================
  publish-pypi:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set version and build
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # =========================================================================
  # 3. Build CLI binary with PyInstaller (3 platforms)
  # =========================================================================

  build-cli:
    # v5.32.0 Nw.2: build-cli now waits on build-native so the Windows
    # path can stage the native ``mnc-win-x64.exe`` into the SDK ZIP
    # at ``dist/mapanare/mnc.exe``. Pre-v5.32.0 ``mnc.exe`` was a copy
    # of the PyInstaller-bundled ``mapanare.exe``, which meant every
    # CLI invocation on a Windows SDK install dispatched through the
    # Python bootstrap — the structural lie v5.31.0 only papered over.
    needs: [release, build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mapanare-linux-x64
            archive_name: mapanare-linux-x64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            artifact: mapanare-mac-arm64
            archive_name: mapanare-mac-arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            artifact: mapanare-win-x64
            archive_name: mapanare-win-x64.zip
            archive_cmd: 7z a

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Mapanare + PyInstaller
        shell: bash
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install -e .
          pip install pyinstaller

      - name: Clean __pycache__
        shell: bash
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build native runtime
        shell: bash
        run: python runtime/native/build_native.py || echo "Native runtime build skipped (optional)"

      - name: Build CLI binary
        run: pyinstaller packaging/mapanare.spec --clean

      # v5.32.0 Nw.2: download the native ``mnc-win-x64.exe`` produced
      # by the build-native Windows job (full stage1 → stage2 self-
      # compile cycle on a Windows runner via w64devkit MinGW). Stage
      # it into the PyInstaller dir as ``mnc.exe`` so the SDK ZIP ships
      # a real native compiler frontend instead of a Python bootstrap
      # alias. Falls back to the PyInstaller copy only if the artifact
      # is missing — protects against a transient build-native failure
      # silently shipping the pre-v5.32.0 alias-shaped ZIP.
      - name: Download native mnc.exe (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: mnc-windows-x64-native
          path: .tmp-native-mnc

      - name: Stage native mnc.exe in Windows CLI bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $native = ".tmp-native-mnc/mnc-win-x64.exe"
          if (-not (Test-Path $native)) {
              throw "FATAL: native mnc-win-x64.exe artifact missing; build-native must have failed"
          }
          # Verify it's actually a PE32+ executable, not a Python stub
          # masquerading as one. ``Get-Item`` on a PE binary reads the
          # 4-byte signature at offset 0x3C → ``PE\0\0`` (0x50 0x45).
          $bytes = [System.IO.File]::ReadAllBytes($native)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "FATAL: native mnc.exe is not a PE binary (no MZ header)"
          }
          Copy-Item $native dist/mapanare/mnc.exe -Force
          Write-Host "Staged native mnc.exe ($($bytes.Length) bytes) into dist/mapanare/"
          # Sanity: the staged binary must NOT be the PyInstaller copy
          # (those are ~30 MB; native is ~3 MB).
          $size = (Get-Item dist/mapanare/mnc.exe).Length
          if ($size -gt 20MB) {
              throw "FATAL: staged mnc.exe is $size bytes (>20 MB suggests PyInstaller copy, not native binary)"
          }

      # v5.35.0 Sq.8: bundle sqlite3.dll alongside the native mnc.exe
      # on Windows. Linux + macOS have system libsqlite3 available since
      # the OS install; Windows users may not. Without the bundle, every
      # `database_open` call from a stdlib/sql/sqlite.mn consumer
      # returns SqlError::LoadFail on a clean Windows machine.
      #
      # Pin: SQLite 3.46.1 win-x64 DLL from sqlite.org's 2024 release
      # directory. The URL + filename + expected SHA256 are fixed in
      # the YAML so a surprise upstream release that drops a symbol
      # the v5.35.0 Sq.7 shim resolves can't brick the publish job
      # silently. CHANGELOG.md ## [5.35.0] Sq.8 line documents this
      # exact pin; bump both at the same time. Do not switch to
      # "latest" — the symbol set is the supply-chain surface.
      #
      # Size guard: 500 KB <= dll <= 5 MB. The expected DLL is ~1.4 MB
      # (uncompressed); the lower bound catches a partial download
      # masquerading as the file, the upper bound catches an HTML
      # redirect / error page that happens to be served as the DLL.
      - name: Bundle sqlite3.dll (Windows SDK + minimal)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip"
          $expectedVersion = "3.46.1"
          New-Item -ItemType Directory -Path .tmp-sqlite -Force | Out-Null
          Write-Host "Downloading pinned sqlite3 DLL: $url"
          Invoke-WebRequest -Uri $url -OutFile .tmp-sqlite/sqlite-dll.zip -UseBasicParsing
          $zipSize = (Get-Item .tmp-sqlite/sqlite-dll.zip).Length
          Write-Host "ZIP size: $zipSize bytes"
          # Extract.
          Expand-Archive -Path .tmp-sqlite/sqlite-dll.zip -DestinationPath .tmp-sqlite -Force
          $dll = ".tmp-sqlite/sqlite3.dll"
          if (-not (Test-Path $dll)) {
              throw "FATAL: sqlite3.dll not found in extracted ZIP"
          }
          $dllSize = (Get-Item $dll).Length
          # Magic check — Windows DLLs are PE32+ which start with
          # MZ (0x4D 0x5A) just like .exe.
          $magic = [System.IO.File]::ReadAllBytes($dll)[0..1]
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
              throw "FATAL: sqlite3.dll does not have MZ header (got $($magic[0]) $($magic[1])) — corrupt download or wrong file"
          }
          # Size guard.
          if ($dllSize -lt 500KB) {
              throw "FATAL: sqlite3.dll is $dllSize bytes (<500 KB suggests partial download)"
          }
          if ($dllSize -gt 5MB) {
              throw "FATAL: sqlite3.dll is $dllSize bytes (>5 MB suggests wrong file or HTML-error-as-DLL)"
          }
          # Stage into the bundle root alongside mnc.exe (matches the
          # v5.32.0 Nw.2 layout decision — flat bundle, not bin/).
          New-Item -ItemType Directory -Path dist/mapanare/bin -Force | Out-Null
          Copy-Item $dll dist/mapanare/bin/sqlite3.dll -Force
          Write-Host "Staged sqlite3.dll v$expectedVersion ($dllSize bytes) at dist/mapanare/bin/sqlite3.dll"

      # v5.33.0 Nu.1: download the native ``mnc-linux-x64`` produced
      # by the build-native Linux job. Stage it into the PyInstaller
      # dir as ``mnc`` so the Linux tarball ships a real native
      # compiler frontend instead of relying on the PyInstaller
      # ``mapanare`` Python bootstrap. Mirrors the v5.32.0 Nw.2
      # Windows wiring exactly — same shape, same guards, ``.exe``
      # suffix dropped on Unix.
      - name: Download native mnc (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: mnc-linux-x64-native
          path: .tmp-native-mnc

      - name: Stage native mnc in Linux CLI bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          native=".tmp-native-mnc/mnc-linux-x64"
          if [ ! -f "$native" ]; then
            echo "FATAL: native mnc-linux-x64 artifact missing; build-native must have failed"
            exit 1
          fi
          # ELF magic: 0x7F 0x45 0x4C 0x46 ("\x7fELF"). Catches a
          # malformed artifact masquerading as a PyInstaller copy.
          head_bytes=$(head -c 4 "$native" | od -An -tx1 | tr -d ' ')
          if [ "$head_bytes" != "7f454c46" ]; then
            echo "FATAL: native mnc is not an ELF binary (head=$head_bytes)"
            exit 1
          fi
          chmod +x "$native"
          cp "$native" dist/mapanare/mnc
          chmod +x dist/mapanare/mnc
          size=$(stat -c%s dist/mapanare/mnc)
          echo "Staged native mnc ($size bytes) into dist/mapanare/"
          # Sanity ceiling: the staged binary must NOT be a
          # PyInstaller copy (those are ~30 MB; native is ~3-4 MB).
          if [ "$size" -gt 20971520 ]; then
            echo "FATAL: staged mnc is $size bytes (>20 MB suggests PyInstaller copy, not native binary)"
            exit 1
          fi
          file dist/mapanare/mnc

      # v5.33.0 Nu.2: download the native ``mnc-darwin-arm64``
      # produced by the build-native macOS job. Mirrors the Linux
      # path; ad-hoc codesign so Gatekeeper doesn't quarantine the
      # binary on first run after tar extraction. Proper Developer
      # ID notarization tracked as v5.34.0+ LOW.
      - name: Download native mnc (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: mnc-darwin-arm64-native
          path: .tmp-native-mnc

      - name: Stage native mnc in macOS CLI bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          native=".tmp-native-mnc/mnc-darwin-arm64"
          if [ ! -f "$native" ]; then
            echo "FATAL: native mnc-darwin-arm64 artifact missing; build-native must have failed"
            exit 1
          fi
          # Mach-O 64-bit magic (little-endian): cffaedfe.
          head_bytes=$(head -c 4 "$native" | od -An -tx1 | tr -d ' ')
          if [ "$head_bytes" != "cffaedfe" ] && [ "$head_bytes" != "feedfacf" ]; then
            echo "FATAL: native mnc is not a Mach-O binary (head=$head_bytes)"
            exit 1
          fi
          chmod +x "$native"
          cp "$native" dist/mapanare/mnc
          chmod +x dist/mapanare/mnc
          # Ad-hoc codesign — identity ``-`` means anonymous self-sign.
          # Required for arm64 macOS to avoid Gatekeeper quarantine.
          codesign -s - dist/mapanare/mnc
          size=$(stat -f%z dist/mapanare/mnc)
          echo "Staged native mnc ($size bytes) into dist/mapanare/"
          if [ "$size" -gt 20971520 ]; then
            echo "FATAL: staged mnc is $size bytes (>20 MB suggests PyInstaller copy, not native binary)"
            exit 1
          fi
          file dist/mapanare/mnc

      - name: Smoke test CLI binary
        shell: bash
        run: |
          BINARY="./dist/mapanare/mapanare"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINARY="./dist/mapanare/mapanare.exe"
          fi
          "$BINARY" --version
          "$BINARY" --help
          echo "CLI smoke test passed"

      # v5.33.0 Nu.4: in-job smoke for the staged native mnc on
      # Linux + macOS. Mirrors the load-bearing checks from the
      # Windows "Clean Windows SDK smoke before archiving" step:
      # version-string match against VERSION + assertion that
      # ``mnc --version`` did not spawn a new Python interpreter.
      # The no-Python assertion is the specific anti-pattern this
      # release closes for Linux/macOS — same as v5.32.0 Nw.4 did
      # for Windows. Fails the job before the tarball is archived.
      - name: Clean Linux/macOS native mnc smoke before archiving
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mnc=./dist/mapanare/mnc
          if [ ! -x "$mnc" ]; then
            echo "FATAL: dist/mapanare/mnc missing or not executable"
            ls -la dist/mapanare/ || true
            exit 1
          fi
          expected=$(cat VERSION | tr -d '[:space:]')
          # Snapshot python process count, run --version, snapshot
          # again. A new Python interpreter would mean the staged mnc
          # is the pre-v5.33.0 Python-bootstrap path, not the native
          # binary. ``pgrep -c`` would return 1 even with zero matches
          # on some systems; use ``-l`` + ``wc -l`` for a stable count.
          py_before=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          out=$("$mnc" --version 2>&1)
          py_after=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          echo "mnc --version output: $out"
          echo "Python process count before=$py_before after=$py_after"
          if [ "$py_after" -gt "$py_before" ]; then
            echo "FATAL: mnc --version spawned a python process (before=$py_before after=$py_after). Native binary did not load — pre-v5.33.0 PyInstaller-Python regression."
            exit 1
          fi
          if ! echo "$out" | grep -qF "$expected"; then
            echo "FATAL: mnc --version output '$out' does not contain expected version '$expected'"
            exit 1
          fi
          echo "OK: native mnc --version is $out (no Python spawned)"

      # -------------------------------------------------------------------
      # v5.12.0 Wk.* - archive the true minimal Windows ZIP before any SDK
      # payload is staged. Then add one curated LLVM-MinGW/UCRT SDK under
      # dist/mapanare/sdk/ and archive the default SDK ZIP.
      # -------------------------------------------------------------------
      - name: Archive minimal CLI bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          V="${{ needs.release.outputs.new_version }}"
          for forbidden in toolchain sdk llvm; do
            if [[ -d "mapanare/$forbidden" ]]; then
              echo "FATAL: minimal ZIP must not contain $forbidden/"
              exit 1
            fi
          done
          7z a "mapanare-${V}-win-x64-minimal.zip" mapanare/
          cp "mapanare-${V}-win-x64-minimal.zip" mapanare-win-x64-minimal.zip
          export ZIP="mapanare-${V}-win-x64-minimal.zip"
          python -c "import os, sys; mb=round(os.path.getsize(os.environ['ZIP'])/1024/1024,1); print(f'Minimal ZIP size: {mb} MB'); sys.exit(1 if mb > 40 else 0)"

      - name: Cache LLVM-MinGW SDK (Windows)
        id: llvm-mingw-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        env:
          LLVM_MINGW_VERSION: "20260421"
        with:
          path: .tmp-llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Download + extract LLVM-MinGW SDK (cache miss)
        if: runner.os == 'Windows' && steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          LLVM_MINGW_VERSION: "20260421"
        run: |
          set -euo pipefail
          mkdir -p .tmp-llvm-mingw
          cd .tmp-llvm-mingw
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-x86_64.zip"
          curl -fL -o llvm-mingw.zip "$url"
          7z x llvm-mingw.zip
          rm llvm-mingw.zip
          ls "llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-x86_64/bin/clang.exe"

      - name: Stage LLVM-MinGW SDK into PyInstaller dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/llvm-mingw-bundle/extract_sdk.ps1 `
              -LlvmMingwDir .tmp-llvm-mingw/llvm-mingw-20260421-ucrt-x86_64 `
              -OutDir dist/mapanare/sdk

      - name: Pre-build Windows runtime archive with SDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SDK_BIN="$PWD/dist/mapanare/sdk/bin"
          mkdir -p dist/mapanare/sdk/lib/mapanare
          VERSION_FLAG="-DMAPANARE_VERSION=\"$(cat VERSION | tr -d '[:space:]')\""
          cd runtime/native
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_core.c   -o mapanare_rt_mapanare_core.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_db.c     -o mapanare_rt_mapanare_db.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_io.c     -o mapanare_rt_mapanare_io.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_html.c   -o mapanare_rt_mapanare_html.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_runtime.c -o mapanare_rt_mapanare_runtime.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_gpu.c    -o mapanare_rt_mapanare_gpu.o
          "$SDK_BIN/clang.exe" -c -O2 -I. $VERSION_FLAG mapanare_gpu_builtins.c -o mapanare_rt_mapanare_gpu_builtins.o
          "$SDK_BIN/llvm-ar.exe" rcs "$GITHUB_WORKSPACE/dist/mapanare/sdk/lib/mapanare/libmapanare_rt.a" \
            mapanare_rt_*.o
          rm -f mapanare_rt_*.o
          ls -la "$GITHUB_WORKSPACE/dist/mapanare/sdk/lib/mapanare/"

      - name: Clean Windows SDK smoke before archiving
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/mapanare/toolchain) {
            throw "toolchain/ must not be staged into the v5.12.0 Windows CLI bundle"
          }
          $env:PATH = "C:\Windows\System32;C:\Windows"
          Remove-Item Env:LIB -ErrorAction SilentlyContinue
          Remove-Item Env:INCLUDE -ErrorAction SilentlyContinue
          Remove-Item Env:CC -ErrorAction SilentlyContinue
          Remove-Item Env:CXX -ErrorAction SilentlyContinue
          @"
          fn main() {
              print("hello from clean Windows SDK smoke")
          }
          "@ | Out-File hello.mn -Encoding ASCII
          # v5.32.0 Nw.4: --version must dispatch to the native binary
          # without spawning Python. Snapshot the python process count
          # before and after, then assert the call did not start a new
          # Python interpreter. (We can't assert "zero Python anywhere"
          # because the runner itself may have python.exe running for
          # unrelated reasons — but we CAN assert ``mnc.exe --version``
          # didn't add to the count.)
          $pyBefore = (Get-Process | Where-Object { $_.Name -match '^python' }).Count
          & ./dist/mapanare/mnc.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          $pyAfter = (Get-Process | Where-Object { $_.Name -match '^python' }).Count
          if ($pyAfter -gt $pyBefore) {
              throw "FATAL: mnc.exe --version spawned a python process (before=$pyBefore, after=$pyAfter). Native binary did not load — pre-v5.32.0 PyInstaller-copy regression."
          }
          Write-Host "OK: mnc.exe --version did not spawn Python (before=$pyBefore, after=$pyAfter)"
          & ./dist/mapanare/mnc.exe run hello.mn
          if ($LASTEXITCODE -ne 0) { throw "run failed" }
          & ./dist/mapanare/mnc.exe build hello.mn -o hello.exe
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & ./hello.exe
          if ($LASTEXITCODE -ne 0) { throw "built exe failed" }
          # `mnc test` remains covered by TR.1 and currently lacks a
          # synthetic main entry point. Keep this smoke focused on the
          # clean-Windows SDK contract: version, run, build, execute.

      # Stage THIRD-PARTY-LICENSES.md inside the bundle so users can
      # read what was redistributed without going to the repo. The doc
      # itself is checked into ``docs/`` (Phase 5).
      - name: Stage third-party license docs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -f docs/THIRD-PARTY-LICENSES.md ]]; then
            cp docs/THIRD-PARTY-LICENSES.md dist/mapanare/THIRD-PARTY-LICENSES.md
          fi

      - name: Archive SDK CLI bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          V="${{ needs.release.outputs.new_version }}"
          if [[ -d mapanare/toolchain ]]; then
            echo "FATAL: toolchain/ must not be shipped after Wk.*"
            exit 1
          fi
          if [[ ! -f mapanare/sdk/bin/clang.exe ]]; then
            echo "FATAL: SDK ZIP missing sdk/bin/clang.exe"
            exit 1
          fi
          7z a "mapanare-${V}-win-x64-sdk.zip" mapanare/
          cp "mapanare-${V}-win-x64-sdk.zip" "mapanare-${V}-win-x64.zip"
          cp "mapanare-${V}-win-x64-sdk.zip" mapanare-win-x64.zip
          export SDK_ZIP="mapanare-${V}-win-x64-sdk.zip"
          python -c "import os, sys; mb=round(os.path.getsize(os.environ['SDK_ZIP'])/1024/1024,1); print(f'SDK ZIP size: {mb} MB'); sys.exit(1 if mb > 180 else 0)"
          python -c "import os; mb=round(os.path.getsize(os.environ['SDK_ZIP'])/1024/1024,1); print('WARNING: SDK ZIP exceeds 150 MB target ({0} MB)'.format(mb)) if mb > 150 else None"

      # v5.11.0 Pk.1: produce a versioned archive (e.g.
      # mapanare-5.11.0-linux-x64.tar.gz) plus a copy at the legacy
      # unversioned name so existing install scripts keep working
      # through the 2-release soak window (drop legacy in v5.13.0).
      - name: Archive CLI binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          V="${{ needs.release.outputs.new_version }}"
          # Compute versioned archive name by inserting -${V} after the
          # 'mapanare' prefix in matrix.archive_name. The matrix entry
          # already encodes platform/extension; we only inject the
          # version segment. Examples:
          #   mapanare-linux-x64.tar.gz -> mapanare-5.11.0-linux-x64.tar.gz
          #   mapanare-mac-arm64.tar.gz -> mapanare-5.11.0-mac-arm64.tar.gz
          #   mapanare-win-x64.zip      -> mapanare-5.11.0-win-x64.zip
          VERSIONED_NAME="${{ matrix.archive_name }}"
          VERSIONED_NAME="${VERSIONED_NAME/mapanare-/mapanare-${V}-}"
          ${{ matrix.archive_cmd }} "$VERSIONED_NAME" mapanare/
          cp "$VERSIONED_NAME" "${{ matrix.archive_name }}"
          ls -la "$VERSIONED_NAME" "${{ matrix.archive_name }}"
          # Stash the computed name for the upload step.
          echo "VERSIONED_ARCHIVE=$VERSIONED_NAME" >> "$GITHUB_ENV"

      - name: Upload CLI archive to GitHub Release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          gh release upload "v${{ needs.release.outputs.new_version }}" \
            "dist/${{ env.VERSIONED_ARCHIVE }}" \
            "dist/${{ matrix.archive_name }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SDK Windows ZIP to GitHub Release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V="${{ needs.release.outputs.new_version }}"
          gh release upload "v${{ needs.release.outputs.new_version }}" \
            "dist/mapanare-${V}-win-x64-sdk.zip" \
            "dist/mapanare-${V}-win-x64.zip" \
            dist/mapanare-win-x64.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5.11.0 Pk.1: upload both versioned + legacy minimal ZIP.
      - name: Upload minimal Windows ZIP to GitHub Release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V="${{ needs.release.outputs.new_version }}"
          gh release upload "v${{ needs.release.outputs.new_version }}" \
            "dist/mapanare-${V}-win-x64-minimal.zip" \
            dist/mapanare-win-x64-minimal.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. Build native compiler binary (mnc) — small, no Python dependency
  # =========================================================================
  build-native:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mnc-linux-x64
            triple: x86_64-linux-gnu
          - os: windows-latest
            artifact: mnc-win-x64.exe
            triple: x86_64-w64-mingw32
          # v5.8.8 Da.3: re-add Apple Silicon native binary. v5.8.7 had
          # to defer this when the macos-13 → macos-latest runner switch
          # surfaced the AAPCS64 ABI bug (Da.1, closed v5.8.8). The Da.2
          # CI gate now exercises the same self-compile path on every
          # PR, so an ABI regression cannot reach this job silently.
          - os: macos-latest
            artifact: mnc-darwin-arm64
            triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Mapanare + LLVM
        shell: bash
        run: |
          echo "${{ needs.release.outputs.new_version }}" > VERSION
          pip install -e .
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y llvm-18 clang-18
            echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm@18
            echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          fi

      # -------------------------------------------------------------------
      # Windows only: vendor a portable MinGW toolchain (w64devkit) so the
      # Windows native-compiler job has gcc/clang without installing LLVM
      # system-wide. Mirrors the build-cli job's toolchain staging.
      # -------------------------------------------------------------------
      - name: Stage portable toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          W64DEVKIT_VERSION: "2.7.0"
        run: |
          set -euo pipefail
          url="https://github.com/skeeto/w64devkit/releases/download/v${W64DEVKIT_VERSION}/w64devkit-x64-${W64DEVKIT_VERSION}.7z.exe"
          mkdir -p .tmp-tc && cd .tmp-tc
          curl -fL -o w64devkit.exe "$url"
          ./w64devkit.exe -y -o.
          mv w64devkit ../toolchain
          cd ..
          ls toolchain/bin/gcc.exe
          ./toolchain/bin/gcc.exe --version

      - name: Build mnc-stage1 via Python
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python scripts/build_stage1.py
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # scripts/build_stage1.py has full Windows support since v4.159.0
            # (MinGW triple, -mno-stack-arg-probe, __chkstk=___chkstk_ms alias,
            # -Wl,--stack,67108864, POSIX-module skip list). It just needs
            # gcc + clang on PATH — the bundled w64devkit provides both.
            export PATH="$PWD/toolchain/bin:$PATH"
            gcc --version
            clang --version
            python scripts/build_stage1.py
            cp mapanare/self/mnc-stage1.exe "${{ matrix.artifact }}"
            ls -la "${{ matrix.artifact }}"
          else
            python scripts/build_stage1.py
          fi

      - name: Self-compile to stage2 (native binary)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # v5.8.4 Wb.2 closed: the self-hosted emit_llvm.mn is now
            # target-aware. mnc-stage1.exe on Windows emits Win64
            # sret-style aggregate-return declarations and call sites
            # for the ~37 runtime fns that previously diverged from
            # gcc's Win64 C ABI. Self-compile-to-stage2 cycle re-enabled.
            export PATH="$PWD/toolchain/bin:$PATH"
            # Wb.1.dx instrumentation (paid forward from v5.8.3 PROMPT
            # Phase 4): if any step crashes, capture a backtrace before
            # the job exits so we don't have to re-trigger CI to
            # diagnose. Cheap; no-op on success.
            set +e
            # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand.
            # The v5.10.0 seed refresh propagated the new run-by-default
            # behavior to mnc-stage1.exe; bare `mnc <file>` would attempt
            # to RUN mnc_all.mn (the compiler) instead of emit IR.
            ./mapanare/self/mnc-stage1.exe emit-llvm mapanare/self/mnc_all.mn > stage2.ll
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "=== Wb.1.dx: mnc-stage1.exe exited $rc; capturing diagnostics ==="
              if command -v gdb >/dev/null; then
                # gdb args mirror the failing invocation above (the
                # explicit `emit-llvm` subcommand is required after
                # v5.9.1 DX.5 made bare `mnc <file.mn>` run-by-default).
                gdb -batch \
                  -ex 'set args emit-llvm mapanare/self/mnc_all.mn' \
                  -ex 'run' -ex 'bt 30' \
                  ./mapanare/self/mnc-stage1.exe || true
              fi
              exit $rc
            fi
            clang --target=x86_64-w64-mingw32 -c -O2 -mno-stack-arg-probe \
              stage2.ll -o stage2.o
            # Stage2 self-compile of mnc_all.mn needs a generous stack
            # because the self-hosted compiler's recursive descent path
            # plus the v5.8.4 sarg/sret allocas push beyond the v5.8.2
            # 64 MB cushion. 256 MB is the next power-of-two and matches
            # what we verified locally.
            VERSION_FLAG="-DMAPANARE_VERSION=\"$(cat VERSION | tr -d '[:space:]')\""
            gcc -O2 stage2.o \
              $VERSION_FLAG \
              runtime/native/mapanare_core.c \
              runtime/native/mapanare_runtime.c \
              runtime/native/mapanare_gpu.c \
              runtime/native/mapanare_gpu_builtins.c \
              mapanare/self/mnc_main.c \
              -I runtime/native \
              -o "${{ matrix.artifact }}" \
              -lm \
              -Wl,--stack,268435456 \
              -Wl,--defsym=__chkstk=___chkstk_ms
            ls -la "${{ matrix.artifact }}"
            # Strip in place to keep the artifact small for releases.
            ./toolchain/bin/strip.exe "${{ matrix.artifact }}" || true
            # Wb.1.dx wrap for the stage2 binary running mnc_all.mn —
            # this is where Wb.2 used to manifest as a hard SIGSEGV.
            # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand.
            # Without it, `mnc <file.mn>` would compile + run mnc_all.mn
            # (the compiler) and then attempt to invoke the resulting
            # binary with no args — pre-v5.11.0 builds papered over this
            # because the deprecation note path still emitted IR; v5.11.0
            # Pk.2 dropped that fallback so the run-by-default dispatch
            # is now hit literally. Manifests as garbage `size_t` from a
            # path-string to `__mn_alloc` (e.g. "...M\eranb..." → OOM).
            set +e
            ./"${{ matrix.artifact }}" emit-llvm mapanare/self/mnc_all.mn > stage3.ll
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "=== Wb.1.dx: mnc-stage2 exited $rc; capturing diagnostics ==="
              if command -v gdb >/dev/null; then
                gdb -batch -ex run -ex 'bt 30' \
                  --args ./"${{ matrix.artifact }}" emit-llvm mapanare/self/mnc_all.mn || true
              fi
              exit $rc
            fi
            # Fixed-point gate. The non-VERSION drift threshold mirrors
            # the Linux/macOS Dr.1 baseline: a strict 4-line VERSION-
            # only diff would be best, but until the self-hosted
            # compiler substitutes __MN_VERSION__ we tolerate up to 10
            # lines (same threshold the v5.8.4 PLAN exit criterion
            # uses).
            diff_count=$(diff stage2.ll stage3.ll | grep -c '^[<>]' || true)
            echo "Windows fixed-point diff: $diff_count lines"
            if [[ $diff_count -gt 10 ]]; then
              echo "FATAL: Windows fixed-point drift > 10 lines"
              diff stage2.ll stage3.ll | head -40 || true
              exit 1
            fi
            echo "Windows fixed point OK (<= 10-line VERSION-only drift)"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # v5.8.8 Da.3: macOS arm64 build path. Differs from Linux on
            # three points: (1) link Metal/Foundation frameworks because
            # mapanare_gpu.c dispatches to the Objective-C Metal backend
            # via mapanare_metal.m; (2) use ld64's -Wl,-stack_size,...
            # syntax (GNU ld -z stack-size= is rejected); (3) include
            # mapanare_io / mapanare_db / mapanare_html (POSIX modules
            # that ship in the Mac binary, unlike Windows).
            # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand.
            ./mapanare/self/mnc-stage1 emit-llvm mapanare/self/mnc_all.mn > /tmp/stage2.ll
            clang -c -O2 /tmp/stage2.ll -o /tmp/stage2.o
            clang -c -O2 -fobjc-arc runtime/native/mapanare_metal.m -o /tmp/mapanare_metal.o
            VERSION_FLAG="-DMAPANARE_VERSION=\"$(cat VERSION | tr -d '[:space:]')\""
            clang -O2 /tmp/stage2.o \
              $VERSION_FLAG \
              runtime/native/mapanare_core.c \
              runtime/native/mapanare_runtime.c \
              runtime/native/mapanare_gpu.c \
              runtime/native/mapanare_gpu_builtins.c \
              runtime/native/mapanare_io.c \
              runtime/native/mapanare_db.c \
              runtime/native/mapanare_html.c \
              /tmp/mapanare_metal.o \
              mapanare/self/mnc_main.c \
              -I runtime/native \
              -o "${{ matrix.artifact }}" \
              -lm -lpthread \
              -framework Metal -framework Foundation -fobjc-arc \
              -Wl,-stack_size,0x4000000
            ls -la "${{ matrix.artifact }}"
            file "${{ matrix.artifact }}"
            strip "${{ matrix.artifact }}" || true
          else
            # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand.
            ./mapanare/self/mnc-stage1 emit-llvm mapanare/self/mnc_all.mn > /tmp/stage2.ll
            clang -c -O2 /tmp/stage2.ll -o /tmp/stage2.o
            VERSION_FLAG="-DMAPANARE_VERSION=\"$(cat VERSION | tr -d '[:space:]')\""
            clang -O2 /tmp/stage2.o \
              $VERSION_FLAG \
              runtime/native/mapanare_core.c \
              runtime/native/mapanare_io.c \
              runtime/native/mapanare_runtime.c \
              runtime/native/mapanare_gpu.c \
              runtime/native/mapanare_gpu_builtins.c \
              mapanare/self/mnc_main.c \
              -I runtime/native \
              -o "${{ matrix.artifact }}" \
              -lm -lpthread -ldl \
              -Wl,-z,stack-size=67108864 2>/dev/null \
              || clang -O2 /tmp/stage2.o \
                $VERSION_FLAG \
                runtime/native/mapanare_core.c \
                runtime/native/mapanare_io.c \
                runtime/native/mapanare_runtime.c \
                runtime/native/mapanare_gpu.c \
                runtime/native/mapanare_gpu_builtins.c \
                mapanare/self/mnc_main.c \
                -I runtime/native \
                -o "${{ matrix.artifact }}" \
                -lm -lpthread -ldl
          fi

      - name: Smoke test native binary
        shell: bash
        run: |
          if [[ -f "${{ matrix.artifact }}" ]]; then
            ./${{ matrix.artifact }} --version
            # Compile a trivial .mn end-to-end to catch any missing-symbol
            # link errors the --version path alone wouldn't exercise.
            # v5.9.1 DX.5: bare `mnc <file.mn>` now compiles + runs; we
            # want IR emission, so use the explicit `emit-llvm`
            # subcommand. Same root cause as the v5.11.2 Pk.2.dx fix
            # for the stage2→stage3 self-validate. (Manifested as
            # "out of memory (requested 7011361785666170466 bytes)" —
            # garbage path-string bytes interpreted as a size_t.)
            echo 'fn main() { print("hello from mnc smoke") }' > mnc_smoke.mn
            ./${{ matrix.artifact }} emit-llvm mnc_smoke.mn > mnc_smoke.ll
            head -5 mnc_smoke.ll
            rm -f mnc_smoke.mn mnc_smoke.ll
            echo "Native binary smoke test passed"
          else
            echo "No native binary produced (platform may not support it)"
          fi

      # v5.11.0 Pk.1: also produce a versioned copy of the native
      # compiler binary. Legacy unversioned name kept as a 2-release
      # alias (drop in v5.13.0).
      - name: Stage versioned native binary
        shell: bash
        run: |
          if [[ -f "${{ matrix.artifact }}" ]]; then
            V="${{ needs.release.outputs.new_version }}"
            # Inject -${V} after the 'mnc' prefix:
            #   mnc-linux-x64       -> mnc-5.11.0-linux-x64
            #   mnc-darwin-arm64    -> mnc-5.11.0-darwin-arm64
            #   mnc-win-x64.exe     -> mnc-5.11.0-win-x64.exe
            VERSIONED_NAME="${{ matrix.artifact }}"
            VERSIONED_NAME="${VERSIONED_NAME/mnc-/mnc-${V}-}"
            cp "${{ matrix.artifact }}" "$VERSIONED_NAME"
            ls -la "$VERSIONED_NAME" "${{ matrix.artifact }}"
            echo "VERSIONED_NATIVE=$VERSIONED_NAME" >> "$GITHUB_ENV"
          fi

      - name: Upload native binary to release
        shell: bash
        run: |
          if [[ -f "${{ matrix.artifact }}" ]]; then
            gh release upload "v${{ needs.release.outputs.new_version }}" \
              "${{ env.VERSIONED_NATIVE }}" \
              "${{ matrix.artifact }}" \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5.32.0 Nw.2 / v5.33.0 Nu.1+Nu.2: expose the native binary as
      # a workflow artifact so build-cli can stage it inside the
      # platform tarball (Windows: ``dist/mapanare/mnc.exe`` in the
      # SDK ZIP; Linux/macOS: ``dist/mapanare/mnc`` in the tar.gz).
      # The release-asset upload above keeps the standalone download
      # path; this artifact is the in-workflow handoff.
      #
      # Windows artifact name (``mnc-windows-x64-native``) is locked
      # by the existing build-cli download step; Linux + macOS names
      # follow the same ``mnc-<platform>-<arch>-native`` convention.
      # Linux aarch64 + macOS x86_64 are deferred to v5.34.0 — neither
      # has an existing native runner here and cross-compile via
      # build_stage1.py is not yet supported (the script always builds
      # for the host; --target/--output flags do not exist).
      - name: Upload native binary as workflow artifact (Windows)
        if: runner.os == 'Windows' && hashFiles(matrix.artifact) != ''
        uses: actions/upload-artifact@v4
        with:
          name: mnc-windows-x64-native
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload native binary as workflow artifact (Linux)
        if: runner.os == 'Linux' && hashFiles(matrix.artifact) != ''
        uses: actions/upload-artifact@v4
        with:
          name: mnc-linux-x64-native
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload native binary as workflow artifact (macOS)
        if: runner.os == 'macOS' && hashFiles(matrix.artifact) != ''
        uses: actions/upload-artifact@v4
        with:
          name: mnc-darwin-arm64-native
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  # =========================================================================
  # 5a. Smoke-test the published Linux versioned tarball end-to-end on
  # a clean ubuntu runner. v5.24.0 Hy.5 (Pk.1.A): mirrors the Windows
  # SDK smoke shape on the Linux tarball so a missing/corrupt release
  # asset trips a smoke gate at publish time, not when a user reports
  # that ``curl ... | tar -xz`` ships a broken binary. 11-release
  # carry from v5.10.0 (Win.1b shipped Windows-only smoke) through
  # v5.22.0 panel (Pk.1.A flagged the asymmetry). The published
  # tarball expands to ``mapanare/mapanare`` (PyInstaller bundle).
  # =========================================================================
  linux-tarball-smoke:
    needs: [release, build-cli]
    runs-on: ubuntu-latest

    steps:
      - name: Download published Linux tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.release.outputs.new_version }}"
          ASSET="mapanare-${V}-linux-x64.tar.gz"
          gh release download "v${V}" -p "$ASSET" -O /tmp/mapanare.tar.gz \
            -R "${{ github.repository }}"
          if [ ! -s /tmp/mapanare.tar.gz ]; then
            echo "FATAL: $ASSET missing or empty in release"
            exit 1
          fi
          ls -la /tmp/mapanare.tar.gz

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Extract + smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/mapanare-extracted
          tar -xzf /tmp/mapanare.tar.gz -C /tmp/mapanare-extracted
          BIN=/tmp/mapanare-extracted/mapanare/mapanare
          if [ ! -x "$BIN" ]; then
            echo "FATAL: tarball missing executable mapanare/mapanare"
            ls -la /tmp/mapanare-extracted/mapanare/ || true
            exit 1
          fi
          "$BIN" --version
          # v5.25.0 Pv.6: multi-line colon. Single-line ``fn x(): y`` was
          # the v5.14.0 SPEC §1009 promise that v5.21.1 H.4 rescoped to
          # v6.0; ``echo 'fn main(): ...'`` here was authored against an
          # unshipped feature and broke the publish pipeline at run #48.
          # tests/test_publish_smoke_fixtures.py locks every .mn fixture
          # in this workflow against a parse-time regression.
          printf 'fn main():\n    print("hello from clean Linux smoke")\n' \
              > /tmp/hello.mn
          "$BIN" emit-llvm /tmp/hello.mn -o /tmp/hello.ll
          if [ ! -s /tmp/hello.ll ]; then
            echo "FATAL: emit-llvm produced empty output"
            exit 1
          fi
          echo "Linux tarball smoke: OK"

      # v5.33.0 Nu.4: verify the published tarball contains a real
      # native ``mnc`` binary (not the pre-v5.33.0 Python-bootstrap
      # path) and that ``mnc --version`` does not spawn a Python
      # interpreter. Mirrors the load-bearing checks from the
      # ``windows-sdk-smoke`` job for the v5.32.0 ``mnc.exe`` path.
      - name: Verify published tarball ships native mnc (Linux)
        run: |
          set -euo pipefail
          MNC=/tmp/mapanare-extracted/mapanare/mnc
          if [ ! -x "$MNC" ]; then
            echo "FATAL: tarball missing executable mapanare/mnc"
            ls -la /tmp/mapanare-extracted/mapanare/ || true
            exit 1
          fi
          # ELF magic check.
          head_bytes=$(head -c 4 "$MNC" | od -An -tx1 | tr -d ' ')
          if [ "$head_bytes" != "7f454c46" ]; then
            echo "FATAL: mnc is not an ELF binary (head=$head_bytes)"
            exit 1
          fi
          # Size ceiling. Native ~3-4 MB; PyInstaller-copy regression
          # would be ~30 MB.
          size=$(stat -c%s "$MNC")
          size_mb=$(python3 -c "print(round($size/1024/1024,1))")
          echo "mnc size: ${size_mb} MB (${size} bytes)"
          if [ "$size" -gt 20971520 ]; then
            echo "FATAL: mnc is ${size_mb} MB (>20 MB suggests PyInstaller copy regression — Nu.1 staging step did not run, or the build-native artifact was missing)"
            exit 1
          fi
          # Version-string match. Catches a stale binary (e.g.,
          # last-release's mnc accidentally re-uploaded).
          expected=$(cat VERSION | tr -d '[:space:]')
          py_before=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          out=$("$MNC" --version 2>&1)
          py_after=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          echo "mnc --version output: $out"
          if ! echo "$out" | grep -qF "$expected"; then
            echo "FATAL: --version output '$out' does not contain expected '$expected'"
            exit 1
          fi
          if [ "$py_after" -gt "$py_before" ]; then
            echo "FATAL: mnc --version spawned a python process (before=$py_before after=$py_after). Native binary did not load."
            exit 1
          fi
          echo "OK: published Linux tarball ships native mnc ($out, no Python spawned)"

  # =========================================================================
  # 5b. Smoke-test the published macOS versioned tarball end-to-end on
  # a clean macos runner. Same shape as linux-tarball-smoke; closes
  # the macOS half of Pk.1.A.
  # =========================================================================
  macos-tarball-smoke:
    needs: [release, build-cli]
    runs-on: macos-latest

    steps:
      - name: Download published macOS tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.release.outputs.new_version }}"
          ASSET="mapanare-${V}-mac-arm64.tar.gz"
          gh release download "v${V}" -p "$ASSET" -O /tmp/mapanare.tar.gz \
            -R "${{ github.repository }}"
          if [ ! -s /tmp/mapanare.tar.gz ]; then
            echo "FATAL: $ASSET missing or empty in release"
            exit 1
          fi
          ls -la /tmp/mapanare.tar.gz

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Extract + smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/mapanare-extracted
          tar -xzf /tmp/mapanare.tar.gz -C /tmp/mapanare-extracted
          BIN=/tmp/mapanare-extracted/mapanare/mapanare
          if [ ! -x "$BIN" ]; then
            echo "FATAL: tarball missing executable mapanare/mapanare"
            ls -la /tmp/mapanare-extracted/mapanare/ || true
            exit 1
          fi
          "$BIN" --version
          # v5.25.0 Pv.6: multi-line colon — see Linux smoke comment above.
          printf 'fn main():\n    print("hello from clean macOS smoke")\n' \
              > /tmp/hello.mn
          "$BIN" emit-llvm /tmp/hello.mn -o /tmp/hello.ll
          if [ ! -s /tmp/hello.ll ]; then
            echo "FATAL: emit-llvm produced empty output"
            exit 1
          fi
          echo "macOS tarball smoke: OK"

      # v5.33.0 Nu.4: verify the published tarball contains a real
      # native ``mnc`` Mach-O binary and that ``mnc --version`` does
      # not spawn a Python interpreter. Mirrors the Linux smoke shape;
      # macOS uses ``stat -f%z`` instead of ``stat -c%s``.
      - name: Verify published tarball ships native mnc (macOS)
        run: |
          set -euo pipefail
          MNC=/tmp/mapanare-extracted/mapanare/mnc
          if [ ! -x "$MNC" ]; then
            echo "FATAL: tarball missing executable mapanare/mnc"
            ls -la /tmp/mapanare-extracted/mapanare/ || true
            exit 1
          fi
          # Mach-O 64-bit magic (LE little-endian: cffaedfe; BE: feedfacf).
          head_bytes=$(head -c 4 "$MNC" | od -An -tx1 | tr -d ' ')
          if [ "$head_bytes" != "cffaedfe" ] && [ "$head_bytes" != "feedfacf" ]; then
            echo "FATAL: mnc is not a Mach-O binary (head=$head_bytes)"
            exit 1
          fi
          size=$(stat -f%z "$MNC")
          size_mb=$(python3 -c "print(round($size/1024/1024,1))")
          echo "mnc size: ${size_mb} MB (${size} bytes)"
          if [ "$size" -gt 20971520 ]; then
            echo "FATAL: mnc is ${size_mb} MB (>20 MB suggests PyInstaller copy regression)"
            exit 1
          fi
          expected=$(cat VERSION | tr -d '[:space:]')
          py_before=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          out=$("$MNC" --version 2>&1)
          py_after=$(pgrep -fl '[Pp]ython' 2>/dev/null | wc -l || echo 0)
          echo "mnc --version output: $out"
          if ! echo "$out" | grep -qF "$expected"; then
            echo "FATAL: --version output '$out' does not contain expected '$expected'"
            exit 1
          fi
          if [ "$py_after" -gt "$py_before" ]; then
            echo "FATAL: mnc --version spawned a python process (before=$py_before after=$py_after). Native binary did not load."
            exit 1
          fi
          echo "OK: published macOS tarball ships native mnc ($out, no Python spawned)"

  # =========================================================================
  # 5. Smoke-test the published Windows SDK ZIP end-to-end with PATH,
  # LIB, and INCLUDE stripped. This catches clean-machine SDK failures
  # before users do.
  # =========================================================================
  windows-sdk-smoke:
    needs: [release, build-cli]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download published SDK ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $V = "${{ needs.release.outputs.new_version }}"
          $Asset = "mapanare-${V}-win-x64-sdk.zip"
          gh release download "v${V}" -p "$Asset" -O mapanare.zip
          if (-not (Test-Path mapanare.zip)) {
            throw "$Asset not found in release"
          }
          $size_mb = [math]::Round((Get-Item mapanare.zip).Length / 1MB, 1)
          Write-Host "SDK ZIP size: $size_mb MB"
          if ($size_mb -gt 180) {
            throw "SDK ZIP exceeds 180 MB hard gate ($size_mb MB)"
          }
          if ($size_mb -gt 150) {
            Write-Warning "SDK ZIP exceeds 150 MB target ($size_mb MB)"
          }

      - name: Extract + smoke (PATH stripped)
        shell: pwsh
        run: |
          Expand-Archive mapanare.zip -DestinationPath out
          if (Test-Path out\mapanare\toolchain) {
            throw "toolchain/ must not be shipped after Wk.*"
          }
          if (-not (Test-Path out\mapanare\sdk\bin\clang.exe)) {
            throw "SDK ZIP missing sdk\bin\clang.exe"
          }
          if (-not (Test-Path out\mapanare\mnc.exe)) {
            throw "SDK ZIP missing mnc.exe"
          }

          # v5.32.0 Nw.4: verify the staged mnc.exe is a native PE
          # binary, not the pre-v5.32.0 PyInstaller-copy stub. The
          # PyInstaller-bundled mapanare.exe is ~30 MB; the native
          # mnc-stage1 strips to ~3-4 MB. Anything > 20 MB at
          # mnc.exe is a regression to the pre-v5.32.0 alias-shaped
          # ZIP.
          $mncSize = (Get-Item out\mapanare\mnc.exe).Length
          $mncSizeMB = [math]::Round($mncSize / 1MB, 1)
          Write-Host "mnc.exe size: $mncSizeMB MB ($mncSize bytes)"
          if ($mncSizeMB -gt 20) {
            throw "FATAL: mnc.exe is $mncSizeMB MB (>20 MB suggests PyInstaller copy regression — Nw.2 staging step did not run, or the build-native artifact was missing)"
          }
          # Verify PE32+ MZ header.
          $head = [System.IO.File]::ReadAllBytes("out\mapanare\mnc.exe") |
                  Select-Object -First 2
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "FATAL: mnc.exe missing MZ header (not a PE binary)"
          }

          $env:PATH = "C:\Windows\System32;C:\Windows"
          Remove-Item Env:LIB -ErrorAction SilentlyContinue
          Remove-Item Env:INCLUDE -ErrorAction SilentlyContinue
          Remove-Item Env:CC -ErrorAction SilentlyContinue
          Remove-Item Env:CXX -ErrorAction SilentlyContinue

          # v5.32.0 Nw.4: --version must dispatch to the native
          # frontend. Snapshot Python process count, run --version,
          # snapshot again. A new Python interpreter would mean we
          # silently shipped the pre-v5.32.0 alias-shaped ZIP.
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $pyBefore = (Get-Process | Where-Object { $_.Name -match '^python' }).Count
          $versionOutput = & ./out/mapanare/mnc.exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version failed: $versionOutput" }
          $pyAfter = (Get-Process | Where-Object { $_.Name -match '^python' }).Count
          if ($pyAfter -gt $pyBefore) {
            throw "FATAL: mnc.exe --version spawned a python process (before=$pyBefore, after=$pyAfter). Native binary did not load."
          }
          if ($versionOutput -notmatch [regex]::Escape($expectedVersion)) {
            throw "FATAL: --version output '$versionOutput' does not contain expected '$expectedVersion'"
          }
          Write-Host "OK: mnc.exe --version is native ($($versionOutput.Trim()))"

          @"
          fn main() {
              print("hello from clean Windows smoke")
          }
          "@ | Out-File hello.mn -Encoding ASCII
          & ./out/mapanare/mnc.exe run hello.mn
          if ($LASTEXITCODE -ne 0) { throw "run failed" }
          & ./out/mapanare/mnc.exe build hello.mn -o hello.exe
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & ./hello.exe
          if ($LASTEXITCODE -ne 0) { throw "built exe failed" }
          Write-Host "Windows SDK smoke: OK"

  # =========================================================================
  # 6. Generate SHA256 checksums for all release artifacts
  # =========================================================================
  checksums:
    needs: [release, build-cli, build-native, windows-sdk-smoke, linux-tarball-smoke, macos-tarball-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release assets
        shell: bash
        run: |
          gh release download "v${{ needs.release.outputs.new_version }}" \
            -D /tmp/assets -R "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd /tmp/assets
          if ls * 1>/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            echo "=== SHA256SUMS.txt ==="
            cat SHA256SUMS.txt
          else
            echo "No assets found"
          fi

      - name: Upload checksums to release
        shell: bash
        run: |
          if [[ -f /tmp/assets/SHA256SUMS.txt ]]; then
            gh release upload "v${{ needs.release.outputs.new_version }}" \
              /tmp/assets/SHA256SUMS.txt --clobber \
              -R "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 7. Update release body with actual asset sizes
  # =========================================================================
  update-release:
    needs: [release, build-cli, build-native, checksums]
    runs-on: ubuntu-latest

    steps:
      - name: Update release body with asset sizes
        uses: actions/github-script@v6
        with:
          script: |
            const version = '${{ needs.release.outputs.new_version }}';
            const releaseId = ${{ needs.release.outputs.release_id }};

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const sizeMap = {};
            for (const asset of release.data.assets) {
              const bytes = asset.size;
              let size;
              if (bytes >= 1024 * 1024 * 1024) {
                size = (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
              } else if (bytes >= 1024 * 1024) {
                size = (bytes / (1024 * 1024)).toFixed(1) + ' MB';
              } else if (bytes >= 1024) {
                size = (bytes / 1024).toFixed(1) + ' KB';
              } else {
                size = bytes + ' B';
              }
              sizeMap[asset.name] = size;
            }

            let body = release.data.body;
            for (const [name, size] of Object.entries(sizeMap)) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`(\\[` + '`' + escaped + '`' + `\\][^|]+\\|)\\s*—\\s*\\|`);
              body = body.replace(pattern, `$1 ${size} |`);
            }

            body = body.replace(/\n> Downloads become available[^\n]*\n?/, '\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: body,
            });
