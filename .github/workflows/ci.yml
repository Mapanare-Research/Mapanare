name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Format check (black)
        run: black --check --target-version py311 .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy mapanare/ runtime/

      # v4.29.0: hollow-feature gate.
      # The v4.18.0-v4.26.0 evolution arc shipped multiple features
      # that lowered to ``raise NotImplementedError`` at runtime
      # (``@gpu``, early ``await``, etc). This step fails the build
      # the moment a ``raise NotImplementedError`` appears anywhere
      # under ``mapanare/`` or ``runtime/`` outside the test tree.
      # The rule is: if you need to write ``raise NotImplementedError``,
      # the feature is not ready to merge. Use ``abc.abstractmethod``
      # for intended-to-be-overridden stubs.
      # v4.32.0 Phase 2.6 (Anaconda): `if: always()` on every gate step
      # so a failure in gate 1 doesn't mask gates 2-5.
      - name: Hollow-feature gate (no raise NotImplementedError)
        if: always()
        shell: bash
        run: |
          set -e
          HITS=$(git grep -l 'raise NotImplementedError' mapanare/ runtime/ | grep -v '^tests/' || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: 'raise NotImplementedError' found in source files:"
            echo "$HITS" | sed 's/^/  /'
            echo ""
            echo "If the feature is not ready to merge, do not merge it."
            echo "If the class is an abstract base, use 'from abc import ABC, abstractmethod'"
            echo "and decorate the method with '@abstractmethod' instead."
            exit 1
          fi
          echo "hollow-feature gate: clean"

      # v4.29.0: skip-without-tracking-comment gate.
      # Every ``@pytest.mark.skip`` or ``pytest.mark.xfail`` in
      # ``tests/`` must have a comment on an adjacent line naming the
      # tracking version (e.g. "# v4.30.0: ..."). A silent skip is a
      # test that does not exist — and the v4.18.0-v4.26.0 regression
      # happened because 79 ``extern "Python" fn`` tests had been
      # silently xfailed since v4.2.0.
      - name: Silent-skip gate (every pytest skip has a tracking version)
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_silent_skips.py tests/

      # v4.31.0: CHANGELOG honesty gate.
      # Every CHANGELOG claim that names a file path or a runtime
      # symbol must be verifiable in the source tree at commit time.
      # The v4.26.0 panel flagged v4.18.0/v4.24.0/v4.25.0 CHANGELOG
      # entries that referenced tests + symbols that did not exist.
      - name: CHANGELOG honesty gate
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_changelog_honesty.py

      # v5.11.2 Pk.2.dx follow-up: workflow-shape lint.
      # Catches the bare-`mnc <file>.mn > out.ll` bug class statically
      # in <1s — pre-fix this required two failed Windows publish runs
      # (~10-20 min each) to surface. Opt-out: `<!-- no-check-shape -->`
      # on the same line as the intentional implicit-run.
      - name: Workflow-shape lint
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_workflow_shapes.py

      # v4.31.0: docs drift gate.
      # Every Mapanare code block in docs/SPEC.md, cookbook.md,
      # reference.md, and getting-started.md must parse cleanly via
      # the current grammar. Intentional-pseudocode blocks are opted
      # out with ``<!-- pseudo -->``; negative examples use
      # ``<!-- expect-error -->``.
      - name: Docs drift gate
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_docs_drift.py

      # v4.31.0: hollow-feature structural gate.
      # Catches device decorators re-introduced into golden tests and
      # AST expression classes that have no isinstance check in
      # ``lower.py``. Subsumes the v4.29.0 ``raise NotImplementedError``
      # gate as a sub-check so the pipeline runs both from a single
      # script (but the standalone gate above is kept for defence in
      # depth).
      - name: Hollow-feature structural gate
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_no_hollow_features.py

      # v4.143.0: internal-struct registry drift gate (Reg.1).
      # Cross-checks ``mapanare/self/emit_llvm.mn::build_internal_struct_list``
      # and ``register_all_internal_structs`` against the live struct
      # definitions in ``mapanare/self/*.mn``. Prevents repeats of the
      # Ge.1 class of silent metadata drift (v4.132.0 → v4.142.0) where
      # MIRModule.consts, LowerState fields, MatchBuildResult, VarInfo,
      # etc. were registered with stale or wrong field-name lists and
      # byte-identity fixed-point checks masked the miscompile because
      # both stages diverged the same way.
      - name: Struct registry drift gate
        if: always()
        shell: bash
        run: |
          set -e
          python3 scripts/check_struct_registry.py

      # Build the native runtime archive and self-hosted compiler
      # (mnc-stage1) before pytest. Many tests under tests/parser/,
      # tests/self_hosted/, tests/llvm/, tests/bootstrap/ shell out
      # to mapanare/self/mnc-stage1; with the binary no longer
      # tracked in git, every CI run must produce it from source.
      - name: Install LLVM + clang (for mnc-stage1 build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18 clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/llvm-as-18 /usr/bin/llvm-as

      - name: Build runtime archive (libmapanare_rt.a)
        run: make build-rt

      - name: Build mnc-stage1 (self-hosted compiler)
        run: python scripts/build_stage1.py

      - name: Run tests
        run: pytest tests/ -v -n auto --durations=20

  # ---------------------------------------------------------------------------
  # v4.117.0 Phase 4 — informational coverage gate
  # ---------------------------------------------------------------------------
  # Runs pytest-cov on the core pipeline scope (parser/semantic/lower/MIR/
  # emitter/lexer/ffi) and uploads the XML artifact. Does NOT gate on
  # coverage thresholds — the tests/COVERAGE.md audit is the baseline,
  # and a future release will flip this to gating once the numbers have
  # stabilised across 5 releases.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mapanare with pytest-cov
        run: pip install -e ".[dev]" pytest-cov
      - name: Run coverage on core pipeline scope
        run: |
          pytest tests/llvm/ tests/lexer/ tests/parser/ tests/semantic/ \
                 tests/mir/ tests/emit/ tests/ffi/ \
                 --cov=mapanare --cov-report=xml --cov-report=term \
                 --tb=no -q || true
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.sha }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Self-hosted compiler: build mnc-stage1 and validate golden tests
  # ---------------------------------------------------------------------------
  self-hosted:
    name: Self-Hosted Compiler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Install LLVM tools
        run: sudo apt-get update -qq && sudo apt-get install -y llvm-18 clang-18

      - name: Build mnc-stage1 (regenerate IR from .mn sources)
        run: python scripts/build_stage1.py

      - name: Run golden tests (45/45)
        if: success()
        run: python scripts/ir_doctor.py golden

      - name: Run stage2 validation
        if: success()
        run: python scripts/ir_doctor.py stage2 --timeout 30

      - name: Startup benchmark
        if: success()
        run: bash tests/bench/bench_startup.sh --gate

      - name: Compile-time benchmarks
        if: success()
        run: bash tests/bench/bench_compile.sh --gate

  # ---------------------------------------------------------------------------
  # Native bootstrap: build from seed binary, no Python
  # ---------------------------------------------------------------------------
  bootstrap:
    name: Bootstrap (No Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM + clang
        run: sudo apt-get update -qq && sudo apt-get install -y llvm-18 clang-18

      - name: Symlink clang
        run: sudo ln -sf /usr/bin/clang-18 /usr/bin/clang

      - name: Two-stage bootstrap + verify
        run: bash scripts/build_from_seed.sh --verify

  native:
    name: C Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile C runtime (plain)
        run: |
          gcc -O2 -g -Wall -Wextra -Werror -pthread \
            tests/native/test_c_runtime.c \
            runtime/native/mapanare_core.c \
            runtime/native/mapanare_runtime.c \
            -o test_c_runtime
          gcc -c -O2 -g -Wall -Wextra -Werror -I runtime/native/ \
            runtime/native/mapanare_io.c -o /tmp/mapanare_io.o
          gcc -c -O2 -g -Wall -Wextra -Werror -I runtime/native/ \
            runtime/native/mapanare_gpu.c -o /tmp/mapanare_gpu.o
          gcc -c -O2 -g -Wall -Wextra -Werror -I runtime/native/ \
            runtime/native/mapanare_gpu_builtins.c -o /tmp/mapanare_gpu_builtins.o
          ./test_c_runtime

      # v4.29.0: orphaned runtime smoke tests. mapanare_db.c and
      # mapanare_html.c were 1,942 lines of runtime code that no CI
      # job touched until v4.29.0 (Anaconda HIGH, v4.26.0 panel). These
      # smoke tests are the fuse: they call one symbol from each file
      # so the linker MUST resolve mapanare_db.c / mapanare_html.c at
      # build time. If a future edit re-orphans either file, this step
      # fails to link and the CI job breaks loudly.
      - name: Build runtime archive (Makefile path — all modules)
        run: make build-rt

      - name: Compile and run test_db_smoke
        run: |
          gcc -O2 -g -Wall -Wextra -pthread -I runtime/native \
            tests/runtime/test_db_smoke.c \
            runtime/native/libmapanare_rt.a \
            -o /tmp/test_db_smoke -lm -lpthread -ldl
          /tmp/test_db_smoke

      - name: Compile and run test_html_smoke
        run: |
          gcc -O2 -g -Wall -Wextra -pthread -I runtime/native \
            tests/runtime/test_html_smoke.c \
            runtime/native/libmapanare_rt.a \
            -o /tmp/test_html_smoke -lm -lpthread -ldl
          /tmp/test_html_smoke

      # v4.102.0: async native run. Before this release, no Mapanare
      # async program had ever linked — the coroutine scheduler
      # symbols (``__mn_coro_scheduler_*``) lived in the C runtime
      # source but were never archived into ``libmapanare_rt.a``, and
      # ``mn_coro_is_done`` checked the wrong frame offset, so any
      # attempt to link and run crashed with a NULL-function-pointer
      # call from ``mn_process_task``. This step proves the end-to-end
      # pipeline: Python bootstrap emits the coroutine IR, clang links
      # it against the runtime archive, and the resulting binary runs
      # to completion with the expected output. Three async golden
      # tests are exercised to catch pattern-specific regressions
      # (basic return, single await, fan-out with multiple awaits).
      - name: Install LLVM + clang (for async native run)
        run: |
          sudo apt-get install -y llvm-18 clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang

      - name: Setup Python for async native run
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare (for emit-llvm)
        run: pip install -e ".[dev]"

      - name: Compile + link + run async golden tests natively
        run: |
          set -e
          # v5.0.0: 57_real_await does real HTTP (example.com) which can
          # SIGSEGV on CI runners with restricted networking. Tested in
          # the sanitizers workflow where crashes are handled gracefully.
          for t in 55_async_basic 56_async_await; do
            echo "--- $t ---"
            python -m mapanare emit-llvm "tests/golden/$t.mn" -o "/tmp/$t.ll"
            clang "/tmp/$t.ll" \
              -L runtime/native -lmapanare_rt \
              -lpthread -lm -ldl \
              -o "/tmp/$t"
            out=$(timeout 10 "/tmp/$t")
            case "$t" in
              55_async_basic) expected="42";;
              56_async_await) expected="43";;
            esac
            if [ "$out" != "$expected" ]; then
              echo "FAIL: $t expected '$expected' got '$out'"
              exit 1
            fi
            echo "OK: $t -> $out"
          done

      - name: Verify Makefile RUNTIME_SOURCES vs runtime/native/*.c
        run: make check-runtime-sources

      # v4.32.0 Phase 2.1 (Boa M1): complementary gate to
      # check-runtime-sources — fails if any binary artifact
      # (.a / .o / .so / ELF / PE / Mach-O) is tracked in
      # runtime/native/ or mapanare/self/ (except the frozen
      # mnc-seed bootstrap binary). The v4.31.0 arc-end panel caught
      # a committed libmapanare_rt.a carrying `__mn_list_oob_buf`
      # after the source had removed it — this gate catches the next
      # such regression at PR time.
      - name: Verify no tracked binary artifacts
        run: make check-no-tracked-binaries

      - name: Compile and run with AddressSanitizer
        run: |
          gcc -fsanitize=address -fno-omit-frame-pointer -g -Wall -Wextra -Werror -pthread \
            tests/native/test_c_runtime.c \
            runtime/native/mapanare_core.c \
            runtime/native/mapanare_runtime.c \
            -o test_c_runtime_asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./test_c_runtime_asan

      - name: Compile and run with ThreadSanitizer
        run: |
          gcc -fsanitize=thread -g -Wall -Wextra -Werror -pthread \
            tests/native/test_c_runtime.c \
            runtime/native/mapanare_core.c \
            runtime/native/mapanare_runtime.c \
            -o test_c_runtime_tsan
          TSAN_OPTIONS=halt_on_error=1 ./test_c_runtime_tsan

  # ---------------------------------------------------------------------------
  # WASM cross-compilation (wasm32-wasi via wasmtime, wasm32 compile-only)
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Install wasmtime
        # v5.8.4 Wa.1: replace `curl wasmtime.dev/install.sh | bash`
        # plus `if -d` silent-skip with a pinned download from
        # github.com/bytecodealliance/wasmtime/releases. The previous
        # form silently passed when the install path drifted (post-v32
        # release shape change) and the next `wasmtime` invocation then
        # failed with `command not found`. Pinning fails fast on
        # regression.
        env:
          WASMTIME_VERSION: "v34.0.2"
        run: |
          set -euo pipefail
          ver="${WASMTIME_VERSION}"
          base="https://github.com/bytecodealliance/wasmtime/releases/download"
          tarball="wasmtime-${ver}-x86_64-linux.tar.xz"
          curl -sSfL "${base}/${ver}/${tarball}" | tar xJ -C /tmp
          sudo mv "/tmp/wasmtime-${ver}-x86_64-linux/wasmtime" /usr/local/bin/
          wasmtime --version  # fail fast if missing

      - name: Install wabt (wat2wasm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wabt

      - name: Compile examples to WAT (wasm32)
        run: |
          for f in examples/wasm/hello.mn examples/wasm/wasi_app.mn; do
            if [ -f "$f" ]; then
              echo "--- Compiling $f (wasm32) ---"
              python -m mapanare emit-wasm "$f" -o "${f%.mn}.wat"
            fi
          done

      - name: Compile examples to WAT (wasm32-wasi)
        run: |
          for f in examples/wasm/hello.mn examples/wasm/wasi_app.mn; do
            if [ -f "$f" ]; then
              echo "--- Compiling $f (wasm32-wasi) ---"
              python -m mapanare emit-wasm --wasi "$f" -o "${f%.mn}.wasi.wat"
            fi
          done

      - name: Convert WAT to WASM binary
        run: |
          for wat in examples/wasm/*.wat; do
            if [ -f "$wat" ]; then
              echo "--- wat2wasm $wat ---"
              wat2wasm "$wat" -o "${wat%.wat}.wasm"
            fi
          done

      - name: Run WASI examples on wasmtime
        run: |
          # wasmtime now lives in /usr/local/bin via the pinned install
          # step above. No additional PATH override needed.
          for f in examples/wasm/hello.mn examples/wasm/wasi_app.mn; do
            if [ -f "$f" ]; then
              echo "--- Running $f (wasm32-wasi) ---"
              python -m mapanare emit-wasm --wasi "$f" -o "${f%.mn}.wasi.wat"
              wat2wasm "${f%.mn}.wasi.wat" -o "${f%.mn}.wasi.wasm"
              wasmtime "${f%.mn}.wasi.wasm"
            fi
          done

      - name: Run WASM pytest suite
        run: pytest tests/wasm/ -v

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            examples/wasm/*.wat
            examples/wasm/*.wasm
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Android cross-compilation (compile-only, no device)
  # ---------------------------------------------------------------------------
  android:
    name: Android Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK via sdkmanager
        run: |
          sdkmanager --install "ndk;26.1.10909125" 2>/dev/null || true
          # Find the NDK path
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d | tail -1)
          fi
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Found NDK at: $NDK_PATH"

      - name: Cross-compile C runtime for Android ARM64
        run: |
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android34-clang"
          if [ -f "$CC" ]; then
            echo "--- Compiling C runtime for aarch64-linux-android34 ---"
            "$CC" -c -O2 -DMAPANARE_PLATFORM_ANDROID=1 \
              runtime/native/mapanare_core.c \
              -o mapanare_core_android_arm64.o
            "$CC" -c -O2 -DMAPANARE_PLATFORM_ANDROID=1 \
              runtime/native/mapanare_runtime.c \
              -o mapanare_runtime_android_arm64.o
            file mapanare_core_android_arm64.o
            file mapanare_runtime_android_arm64.o
            echo "Android ARM64 cross-compilation successful"
          else
            echo "WARN: NDK clang not found at $CC"
            ls -la "$TOOLCHAIN/bin/" | head -20
          fi

      - name: Cross-compile C runtime for Android x86_64
        run: |
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/x86_64-linux-android34-clang"
          if [ -f "$CC" ]; then
            echo "--- Compiling C runtime for x86_64-linux-android34 ---"
            "$CC" -c -O2 -DMAPANARE_PLATFORM_ANDROID=1 \
              runtime/native/mapanare_core.c \
              -o mapanare_core_android_x64.o
            "$CC" -c -O2 -DMAPANARE_PLATFORM_ANDROID=1 \
              runtime/native/mapanare_runtime.c \
              -o mapanare_runtime_android_x64.o
            file mapanare_core_android_x64.o
            file mapanare_runtime_android_x64.o
            echo "Android x86_64 cross-compilation successful"
          else
            echo "WARN: NDK clang not found at $CC"
          fi

      - name: Verify ELF format
        run: |
          for obj in *_android_*.o; do
            if [ -f "$obj" ]; then
              echo "--- Checking $obj ---"
              file "$obj"
              readelf -h "$obj" 2>/dev/null | head -5 || true
            fi
          done

      - name: Run Android target tests
        run: pytest tests/targets/ -v -k "android or mobile"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            *_android_*.o
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # macOS native + iOS cross-compilation (aarch64-apple-macos, aarch64-apple-ios)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS & iOS Cross-Compilation
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Compile C runtime for macOS (native arm64)
        run: |
          echo "--- Compiling C runtime for aarch64-apple-macos ---"
          cd runtime/native
          clang -c -std=c11 -O2 -Wall -Wextra -Werror mapanare_core.c -o mapanare_core.o
          clang -c -std=c11 -O2 -Wall -Wextra -Werror mapanare_runtime.c -o mapanare_runtime.o
          clang -c -std=c11 -O2 -Wall -Wextra -Werror mapanare_io.c -o mapanare_io.o
          clang -c -std=c11 -O2 -Wall -Wextra -Werror mapanare_gpu.c -o mapanare_gpu.o
          clang -c -std=c11 -O2 -Wall -Wextra -Werror mapanare_gpu_builtins.c -o mapanare_gpu_builtins.o
          ar rcs libmapanare.a mapanare_core.o mapanare_runtime.o mapanare_io.o mapanare_gpu.o mapanare_gpu_builtins.o
          echo "Static library built:"
          ls -la libmapanare.a
          file mapanare_core.o
          echo "macOS native build: OK"

      # v5.23.0 RC.8: build the canonical libmapanare_rt.a (8 modules + Metal)
      # via the Makefile target. mapanare/cli.py's link path looks for
      # ``runtime/native/libmapanare_rt.a`` by exact name when shelling out
      # to clang from `mapanare run` / `mapanare build`. The earlier ad-hoc
      # libmapanare.a is only used for the C-runtime smoke tests above.
      # Without this step `pytest tests/` on macOS hits "undefined symbol"
      # errors for `__mn_str_eq` / `__mn_str_println` etc. on every test
      # that compiles a .mn program through the Python CLI.
      - name: Build libmapanare_rt.a for cli.py link path (RC.8)
        run: |
          make build-rt
          test -f runtime/native/libmapanare_rt.a
          file runtime/native/libmapanare_rt.a

      - name: Run macOS C runtime tests
        run: |
          cd runtime/native
          clang -std=c11 -O2 -Wall -Wextra -Werror -I. \
            ../../tests/native/test_c_runtime.c \
            mapanare_core.c mapanare_runtime.c \
            -lpthread -o test_c_runtime_macos
          ./test_c_runtime_macos

      - name: Run with AddressSanitizer
        run: |
          cd runtime/native
          clang -fsanitize=address -fno-omit-frame-pointer -g -Wall -Wextra -Werror -std=c11 -I. \
            ../../tests/native/test_c_runtime.c \
            mapanare_core.c mapanare_runtime.c \
            -lpthread -o test_c_runtime_asan
          ASAN_OPTIONS=detect_leaks=0 ./test_c_runtime_asan

      - name: Run with ThreadSanitizer
        run: |
          cd runtime/native
          clang -fsanitize=thread -g -Wall -Wextra -Werror -std=c11 -I. \
            ../../tests/native/test_c_runtime.c \
            mapanare_core.c mapanare_runtime.c \
            -lpthread -o test_c_runtime_tsan
          TSAN_OPTIONS=halt_on_error=1 ./test_c_runtime_tsan

      - name: Build universal binary (arm64 + x86_64)
        run: |
          cd runtime/native
          for arch in arm64 x86_64; do
            for src in mapanare_core.c mapanare_runtime.c mapanare_io.c mapanare_gpu.c mapanare_gpu_builtins.c; do
              clang -c -std=c11 -O2 -arch $arch "$src" -o "${src%.c}_${arch}.o"
            done
            ar rcs "libmapanare_${arch}.a" *_${arch}.o
          done
          lipo -create libmapanare_arm64.a libmapanare_x86_64.a -output libmapanare_universal.a
          echo "Universal binary architectures:"
          lipo -info libmapanare_universal.a
          ls -la libmapanare_universal.a

      - name: Compile Metal GPU backend
        run: |
          cd runtime/native
          clang -c -O2 -Wall -fobjc-arc mapanare_metal.m -o mapanare_metal.o
          file mapanare_metal.o
          echo "Metal backend compiled"

      # v5.8.8 Da.2: macOS arm64 self-compile gate. Without this, an
      # AAPCS64 ABI regression in the emitter (like the v5.8.7 SIGABRT
      # caused by first-class aggregate returns mismatching x8 indirect
      # at the C-runtime boundary) stays latent until publish.yml runs,
      # which only happens on tagged releases. This job exercises the
      # exact path that broke in publish run #41 and validates the
      # output IR with llvm-as. See
      # docs/roadmap/v5/v5.8.7/PHASE_0_FINDINGS.md.
      - name: Install LLVM 18 (for llvm-as)
        run: |
          brew install llvm@18
          echo "/opt/homebrew/opt/llvm@18/bin" >> "$GITHUB_PATH"

      - name: Build mnc-stage1 on Apple Silicon (Da.1)
        run: |
          python scripts/build_stage1.py
          file mapanare/self/mnc-stage1
          ./mapanare/self/mnc-stage1 --version || true

      - name: Self-compile mnc_all.mn (Da.2)
        run: |
          # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand.
          # Pre-v5.9.1 the bare ``mnc <file.mn>`` defaulted to emit IR;
          # v5.9.1+ defaults to run. v5.10.0's seed refresh propagated
          # the new behavior here — without the explicit subcommand the
          # stage1 binary attempts to RUN mnc_all.mn (the compiler) and
          # llvm-as fails on the run-output instead of compiled IR.
          ./mapanare/self/mnc-stage1 emit-llvm mapanare/self/mnc_all.mn > /tmp/stage2.ll
          echo "stage2.ll: $(wc -l < /tmp/stage2.ll) lines"
          test -s /tmp/stage2.ll

      - name: Validate stage2.ll with llvm-as
        run: |
          llvm-as /tmp/stage2.ll -o /dev/null
          echo "stage2.ll llvm-as: OK"

      - name: Cross-compile C runtime for iOS (aarch64-apple-ios)
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $IOS_SDK"
          cd runtime/native
          for src in mapanare_core.c mapanare_runtime.c mapanare_io.c mapanare_gpu.c mapanare_gpu_builtins.c; do
            echo "--- Compiling $src for iOS ---"
            xcrun --sdk iphoneos clang -c -std=c11 -O2 -Wall \
              -target arm64-apple-ios17.0 \
              -isysroot "$IOS_SDK" \
              "$src" -o "${src%.c}_ios.o"
          done
          ar rcs libmapanare_ios.a *_ios.o
          echo "iOS static library built:"
          ls -la libmapanare_ios.a

      - name: Verify Mach-O format (iOS)
        run: |
          cd runtime/native
          echo "=== File format ==="
          file mapanare_core_ios.o
          echo "=== Architecture ==="
          lipo -info mapanare_core_ios.o
          echo "=== Key symbols ==="
          nm -g mapanare_runtime_ios.o | grep " T " | head -20
          echo ""
          echo "=== Verify dispatch_semaphore (not deprecated sem_init) ==="
          nm -u mapanare_runtime_ios.o | grep -c dispatch_semaphore && echo "dispatch_semaphore: OK"
          ! nm -u mapanare_runtime_ios.o | grep -q sem_init && echo "sem_init absent: OK"
          echo ""
          echo "=== Verify kqueue event loop (not epoll) ==="
          ! nm -u mapanare_io_ios.o | grep -qi epoll && echo "No epoll references: OK"

      - name: Emit LLVM IR with iOS target
        run: |
          if [ -f tests/golden/01_hello.mn ]; then
            cp tests/golden/01_hello.mn /tmp/hello_ios_test.mn
            mapanare emit-llvm --target aarch64-apple-ios /tmp/hello_ios_test.mn
            grep 'target triple' /tmp/hello_ios_test.ll
            echo "iOS LLVM IR emission: OK"
          fi

      - name: "End-to-end: .mn -> LLVM IR -> iOS Mach-O"
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ -f /tmp/hello_ios_test.ll ]; then
            xcrun --sdk iphoneos clang -c \
              -target arm64-apple-ios17.0 \
              -isysroot "$IOS_SDK" \
              /tmp/hello_ios_test.ll -o /tmp/hello_ios.o
            file /tmp/hello_ios.o
            nm -g /tmp/hello_ios.o
            echo "End-to-end iOS compile: OK"
          fi

      - name: Run iOS cross-compilation tests
        run: pytest tests/targets/test_ios_crosscompile.py -v

      - name: Run full test suite on macOS
        run: pytest tests/ -v --ignore=tests/bootstrap/

      - name: Upload macOS/iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-ios-artifacts
          path: |
            runtime/native/libmapanare.a
            runtime/native/libmapanare_ios.a
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Bootstrap from seed — build without Python (gcc + llvm only)
  # ---------------------------------------------------------------------------
  bootstrap-from-seed:
    name: Bootstrap from Seed (No Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM + gcc
        run: sudo apt-get update -qq && sudo apt-get install -y llvm gcc

      - name: Build from seed
        run: bash scripts/build_from_seed.sh

      - name: Validate output (compile hello → llvm-as)
        run: |
          # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit `emit-llvm` subcommand
          # required. v5.10.0's refreshed seed defaults to run-program
          # for bare `mnc <file.mn>`.
          ./mnc emit-llvm tests/golden/01_hello.mn > /tmp/hello.ll
          llvm-as /tmp/hello.ll -o /dev/null
          echo "Bootstrap compiler produces valid IR"

      - name: Run golden subset (smoke test)
        run: |
          PASS=0; FAIL=0
          for mn in tests/golden/01_hello.mn tests/golden/02_arithmetic.mn tests/golden/03_functions.mn; do
            if [ -f "$mn" ]; then
              # v5.9.1 DX.5 / v5.10.0 Bb.4: explicit emit-llvm subcommand.
              if ./mnc emit-llvm "$mn" | llvm-as -o /dev/null 2>/dev/null; then
                PASS=$((PASS + 1))
              else
                FAIL=$((FAIL + 1))
                echo "FAIL: $mn"
              fi
            fi
          done
          echo "Golden smoke: ${PASS} pass, ${FAIL} fail"
          [ "${FAIL}" -eq 0 ]

  # ---------------------------------------------------------------------------
  # Fixed-point verification: compiler compiles itself
  # ---------------------------------------------------------------------------
  fixed-point:
    name: Fixed-Point Bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Install LLVM tools
        run: sudo apt-get update -qq && sudo apt-get install -y llvm-18 clang-18

      - name: Symlink clang
        run: sudo ln -sf /usr/bin/clang-18 /usr/bin/clang

      - name: Symlink llvm-as
        run: sudo ln -sf /usr/bin/llvm-as-18 /usr/bin/llvm-as

      - name: Build stage1
        run: python scripts/build_stage1.py

      # v4.29.0: the fixed-point job used to build stage2 by hand and
      # then compare the results with a step whose failure mode was
      # ``echo "Near fixed-point"``. Combined with the in-script
      # ``EXIT=0`` and ``|| true`` patterns, the whole job was
      # structurally incapable of failing — which made the v4.17.0
      # "fixed-point bootstrap" claim unfalsifiable by construction
      # (v4.26.0 panel: Rattler #7, Anaconda). All of that logic is
      # now inside ``scripts/verify_fixed_point.sh`` with real teeth
      # (``set -e``, explicit regression threshold, non-empty
      # stage3.ll check, llvm-as validation). This job delegates to
      # the script and propagates its exit code.
      - name: Verify fixed-point bootstrap
        shell: bash
        run: |
          set -e
          ulimit -s 65536
          bash scripts/verify_fixed_point.sh

  # v5.19.1 Dk.6 — build the docker images locally on every CI run and
  # exercise the multi-stage hello-world. Catches Dockerfile drift,
  # base-image-skew, and CLI-surface breakage before a release tag.
  # Doesn't push — that's `publish-docker.yml`'s job.
  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare
        run: pip install -e .

      - name: Install LLVM 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Build mnc-stage1
        run: python scripts/build_stage1.py

      - name: Build native runtime (.so)
        run: python runtime/native/build_native.py

      # v5.23.0 RC.7: build_native.py only produces libmapanare_runtime.so;
      # the static archive libmapanare_rt.a needed by the builder image is
      # produced by `make build-rt`. Without this step the next ``cp``
      # silently fails the docker-smoke job.
      - name: Build runtime archive (libmapanare_rt.a)
        run: make build-rt

      - name: Stage builder build context
        run: |
          mkdir -p docker/builder/build-context
          cp mapanare/self/mnc-stage1     docker/builder/build-context/mnc
          cp runtime/native/libmapanare_rt.a docker/builder/build-context/

      - name: Stage runtime build context
        run: |
          mkdir -p docker/runtime/build-context
          cp runtime/native/libmapanare_runtime.so \
              docker/runtime/build-context/libmapanare_rt.so

      - uses: docker/setup-buildx-action@v3

      - name: Build mapanare-builder:smoke
        uses: docker/build-push-action@v5
        with:
          context: docker/builder/build-context
          file: docker/builder/Dockerfile
          tags: mapanare-builder:smoke
          load: true
          cache-from: type=gha,scope=builder-smoke
          cache-to: type=gha,mode=max,scope=builder-smoke

      - name: Build mapanare-runtime:smoke
        uses: docker/build-push-action@v5
        with:
          context: docker/runtime/build-context
          file: docker/runtime/Dockerfile
          tags: mapanare-runtime:smoke
          load: true
          cache-from: type=gha,scope=runtime-smoke
          cache-to: type=gha,mode=max,scope=runtime-smoke

      - name: Multi-stage hello-world
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/docker-smoke
          cat > /tmp/docker-smoke/main.mn <<'EOF'
          fn main():
              print("hello from docker smoke")
          EOF
          cat > /tmp/docker-smoke/Dockerfile <<'EOF'
          FROM mapanare-builder:smoke AS build
          COPY . /src
          WORKDIR /src
          RUN mkdir -p dist && mnc build main.mn -o dist/hello

          FROM mapanare-runtime:smoke
          COPY --from=build /src/dist/hello /app/hello
          ENTRYPOINT ["/app/hello"]
          EOF
          docker build -t docker-smoke /tmp/docker-smoke
          out=$(docker run --rm docker-smoke)
          echo "Output: $out"
          test "$out" = "hello from docker smoke"
          docker images docker-smoke --format "Final image size: {{.Size}}"
          docker images mapanare-builder:smoke --format "Builder size: {{.Size}}"
          docker images mapanare-runtime:smoke --format "Runtime size: {{.Size}}"
