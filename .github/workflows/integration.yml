name: Integration Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Golden Pipeline (emit → llvm-as → opt → llc → link → run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mapanare
        run: pip install -e ".[dev]"

      - name: Install LLVM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y llvm-18 clang-18

      - name: Symlink LLVM tools
        run: |
          sudo ln -sf /usr/bin/llvm-as-18 /usr/bin/llvm-as
          sudo ln -sf /usr/bin/opt-18 /usr/bin/opt
          sudo ln -sf /usr/bin/llc-18 /usr/bin/llc
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang

      - name: Build C runtime
        run: make build-rt

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --junitxml=integration-results.xml

      - name: Generate results report
        if: always()
        run: python scripts/integration_report.py integration-results.xml tests/integration/RESULTS.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            integration-results.xml
            tests/integration/RESULTS.md
          retention-days: 30
          if-no-files-found: ignore
