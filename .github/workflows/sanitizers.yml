name: sanitizers

# v4.105.0 Phase 5 — run valgrind + AddressSanitizer against the native
# compiler on every push/PR to `dev`. The valgrind job scans 64 golden
# tests; the ASan job runs the self-hosted compiler compiled with
# -fsanitize=address. The goal is regression prevention: any new
# memory-safety finding fails the build, surfacing the bug at PR time
# rather than months later. This CI is the permanent arm of what
# Phase 1-3 of v4.105.0 measured as one-off reports.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    name: valgrind (golden suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      - name: Build mnc-stage1
        run: python scripts/build_stage1.py

      - name: Valgrind — full golden suite (documented baseline)
        # 36 of 64 tests have known pre-existing memory errors (see
        # docs/roadmap/v4/v4.105.0/VALGRIND_REPORT.md, docket items
        # Vg.1-Vg.7). This step records the CURRENT count and fails
        # the build if a new test regresses into ERRORS.
        run: |
          bash scripts/valgrind_all_goldens.sh
          python scripts/check_valgrind_baseline.py \
              /tmp/v4_105_valgrind/valgrind-summary.tsv \
              docs/roadmap/v4/v4.105.0/artifacts/valgrind-summary.tsv

      - name: Upload valgrind artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-${{ github.sha }}
          path: |
            /tmp/v4_105_valgrind/valgrind-summary.tsv
            /tmp/v4_105_valgrind/*.log
          retention-days: 14

  asan:
    name: AddressSanitizer (golden suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      - name: Build mnc-stage1 (normal) — produces main.ll
        run: python scripts/build_stage1.py

      - name: Build mnc-stage1-asan
        run: bash scripts/build_asan.sh

      - name: ASan — full golden suite with leak detection off
        # 17 of 64 tests have known ASan errors (see ASAN_REPORT.md,
        # docket items As.1-As.3). This step records the CURRENT count
        # and fails the build if a new test regresses into ASAN_ERROR.
        run: |
          bash scripts/run_asan_goldens.sh
          python scripts/check_asan_baseline.py \
              /tmp/v4_105_asan/asan-summary.tsv \
              docs/roadmap/v4/v4.105.0/artifacts/asan-summary.tsv

      - name: Upload ASan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-${{ github.sha }}
          path: |
            /tmp/v4_105_asan/asan-summary.tsv
            /tmp/v4_105_asan/*.err
          retention-days: 14

  leak-check:
    name: LeakSanitizer (compiled-output leak gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      # v5.4.2: gate compiled-golden leak-cleanness under LSan. Orthogonal
      # to the ASan UAF/overflow job above (that one instruments
      # mnc-stage1 itself; this one instruments the binary mnc-stage1
      # produced). Suppressions live in scripts/asan_leak_suppressions.txt;
      # the baseline lives in docs/roadmap/v5/v5.4.2/baseline/
      # asan-leak-baseline.tsv. check_leak_summary.py fails CI on any
      # regression (new leak, worsened count, or RUN_FAIL).
      - name: Build mnc-stage1 (normal) + runtime
        run: |
          make build-rt
          python scripts/build_stage1.py

      - name: LSan — compile+link+run every golden under detect_leaks=1
        run: |
          bash scripts/run_asan_leak_goldens.sh
          python3 scripts/check_leak_summary.py

      - name: Upload leak-sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-leak-${{ github.sha }}
          path: |
            /tmp/asan-leak/asan-leak-summary.tsv
            /tmp/asan-leak/*.run.err
          retention-days: 14

  sanitizer-mnc-stage1:
    # v5.23.1 Mb.3 — valgrind regression gate on mnc-stage1 itself.
    # The byte-identical oracle in tests/bootstrap/test_indent_preprocessor.py
    # cannot detect lifecycle issues; this gate would have caught V.9
    # (the __mn_indent_to_braces leak that was missable for two releases)
    # at v5.14.1. Runs valgrind --leak-check=full on a colon-syntax
    # golden plus the three Te.5 goldens whose ASan-detected leaks
    # were closed in v5.23.1 Mb.2.
    name: Valgrind on mnc-stage1 (lifecycle leak gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLVM + valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      - name: Build mnc-stage1 + runtime
        run: |
          make build-rt
          python scripts/build_stage1.py

      # mnc-stage1 has known pre-existing leaks unrelated to V.9 / Mb.2
      # (e.g., semantic__check_call_expr, __mn_file_read_or_empty,
      # __mn_str_join — all bounded to single-shot in mnc-stage1, OS-
      # reaped on exit). The gate cannot use --error-exitcode=1 directly
      # without a suppression list. Instead, capture full valgrind output
      # and grep for the specific leak markers we just closed: any
      # reappearance of "__mn_indent_to_braces" in the leak chain means
      # V.9 regressed; any "definitely lost" frame from the wrap_some
      # malloc site means the Te.5 box-tracking regressed.
      - name: Valgrind — colon-syntax golden (V.9 regression gate)
        run: |
          valgrind --leak-check=full --track-origins=yes \
            mapanare/self/mnc-stage1 emit-llvm tests/golden/86_let_destructure_rest.mn \
            -o /tmp/86.ll > /tmp/v_86.txt 2>&1 || true
          if grep -q "__mn_indent_to_braces" /tmp/v_86.txt; then
            echo "::error::V.9 regression — __mn_indent_to_braces leak reappeared"
            grep -B1 -A4 "__mn_indent_to_braces" /tmp/v_86.txt
            exit 1
          fi

      - name: Valgrind — Te.5 if-let golden (Mb.2 regression gate)
        run: |
          valgrind --leak-check=full --track-origins=yes \
            mapanare/self/mnc-stage1 emit-llvm tests/golden/88_if_let.mn \
            -o /tmp/88.ll > /tmp/v_88.txt 2>&1 || true
          if grep -q "__mn_indent_to_braces" /tmp/v_88.txt; then
            echo "::error::V.9 regression — __mn_indent_to_braces leak reappeared on 88_if_let"
            grep -B1 -A4 "__mn_indent_to_braces" /tmp/v_88.txt
            exit 1
          fi

      - name: Valgrind — Te.5 while-let golden (Mb.2 regression gate)
        run: |
          valgrind --leak-check=full --track-origins=yes \
            mapanare/self/mnc-stage1 emit-llvm tests/golden/90_while_let.mn \
            -o /tmp/90.ll > /tmp/v_90.txt 2>&1 || true
          if grep -q "__mn_indent_to_braces" /tmp/v_90.txt; then
            echo "::error::V.9 regression — __mn_indent_to_braces leak reappeared on 90_while_let"
            grep -B1 -A4 "__mn_indent_to_braces" /tmp/v_90.txt
            exit 1
          fi

      - name: Valgrind — Te.5 let-else golden (Mb.2 regression gate)
        run: |
          valgrind --leak-check=full --track-origins=yes \
            mapanare/self/mnc-stage1 emit-llvm tests/golden/91_let_else.mn \
            -o /tmp/91.ll > /tmp/v_91.txt 2>&1 || true
          if grep -q "__mn_indent_to_braces" /tmp/v_91.txt; then
            echo "::error::V.9 regression — __mn_indent_to_braces leak reappeared on 91_let_else"
            grep -B1 -A4 "__mn_indent_to_braces" /tmp/v_91.txt
            exit 1
          fi

  sanitizer-cache-walkers:
    # v5.23.1 Mb.6 (V.8 — 3rd cycle): valgrind sweep over the v5.10.0+
    # cache-walker exports (__mn_dir_count_files / __mn_dir_total_size /
    # __mn_dir_remove_recursive) + __mn_executable_dir on the native mnc.
    # Closes the v5.10.0+ delta sanitizer-coverage gap that Viper flagged
    # three panels in a row. Builds a populated cache fixture (3 levels +
    # a non-loop symlink) and exercises stats / clean / --version under
    # valgrind --leak-check=full.
    name: Valgrind on mnc cache walkers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLVM + valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      - name: Build native mnc (stage1)
        run: |
          make build-rt
          python scripts/build_stage1.py

      - name: Populate cache fixture
        # The native main.mn cache subcommand uses ``.mnc_cache`` in CWD
        # (no env-var override at v5.23.1). Build the fixture under that
        # name so ``mnc cache stats`` / ``mnc cache clean`` actually
        # exercise the walker exports.
        run: |
          mkdir -p /tmp/walker-test/.mnc_cache/level1/level2
          touch /tmp/walker-test/.mnc_cache/file1.bin
          touch /tmp/walker-test/.mnc_cache/level1/file2.bin
          touch /tmp/walker-test/.mnc_cache/level1/level2/file3.bin
          ln -s /tmp/walker-test/.mnc_cache/level1 /tmp/walker-test/.mnc_cache/non-loop-symlink
          printf 'mod-a\nmod-b\nmod-c\n' > /tmp/walker-test/.mnc_cache/manifest.txt
          # Stage the binary alongside the fixture so we can cd into the
          # working dir and invoke it via absolute path.
          cp mapanare/self/mnc-stage1 /tmp/walker-test/

      - name: Valgrind — mnc version (exercises __mn_executable_dir)
        run: |
          valgrind --leak-check=full --track-origins=yes \
            mapanare/self/mnc-stage1 version > /tmp/v_ver.txt 2>&1 || true
          if grep -qE "Invalid read|Invalid write|Use of uninitialised|Conditional jump.*uninitialised" /tmp/v_ver.txt; then
            echo "::error::__mn_executable_dir memory error detected"
            cat /tmp/v_ver.txt
            exit 1
          fi
          echo "mnc version under valgrind: OK (no UAF / OOB / uninit)"

      - name: Valgrind — mnc cache stats (exercises walk_count / walk_size)
        run: |
          cd /tmp/walker-test
          valgrind --leak-check=full --track-origins=yes \
            ./mnc-stage1 cache stats > /tmp/v_stats.txt 2>&1 || true
          if grep -qE "Invalid read|Invalid write|Use of uninitialised|Conditional jump.*uninitialised" /tmp/v_stats.txt; then
            echo "::error::cache-walker memory error detected on cache stats"
            cat /tmp/v_stats.txt
            exit 1
          fi
          echo "mnc cache stats under valgrind: OK (no UAF / OOB / uninit)"

      - name: Valgrind — mnc cache clean (exercises remove_recursive)
        run: |
          cd /tmp/walker-test
          valgrind --leak-check=full --track-origins=yes \
            ./mnc-stage1 cache clean > /tmp/v_clean.txt 2>&1 || true
          if grep -qE "Invalid read|Invalid write|Use of uninitialised|Conditional jump.*uninitialised" /tmp/v_clean.txt; then
            echo "::error::cache-walker memory error detected on cache clean"
            cat /tmp/v_clean.txt
            exit 1
          fi
          echo "mnc cache clean under valgrind: OK (no UAF / OOB / uninit)"

  tsan-async:
    name: ThreadSanitizer (async goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          pip install -e ".[dev]"

      - name: Build mnc-stage1 (normal)
        run: python scripts/build_stage1.py

      - name: Build TSan-instrumented libmapanare_rt.a
        run: |
          mkdir -p /tmp/tsan_rt
          for src in mapanare_core.c mapanare_io.c mapanare_runtime.c \
                     mapanare_gpu.c mapanare_gpu_builtins.c \
                     mapanare_db.c mapanare_html.c; do
            clang -c -O1 -g -fsanitize=thread -fno-omit-frame-pointer -fPIC \
                -I runtime/native \
                "-DMAPANARE_VERSION=\"$(cat VERSION)\"" \
                "runtime/native/$src" -o "/tmp/tsan_rt/${src%.c}.o"
          done
          ar rcs /tmp/tsan_rt/libmapanare_rt_tsan.a /tmp/tsan_rt/*.o

      - name: Compile async goldens to IR via bootstrap
        run: |
          mkdir -p /tmp/async
          for t in 55_async_basic 56_async_await 57_real_await; do
            python -m mapanare emit-llvm "tests/golden/$t.mn" -o "/tmp/async/$t.ll"
            clang -S -O1 "/tmp/async/$t.ll" -o "/tmp/async/$t.s"
          done

      - name: Link async goldens against TSan runtime and run them
        # v4.102.0 made these tests run natively; Phase 3 of v4.105.0
        # demonstrated 0 races. This CI gate enforces that permanent.
        run: |
          export TSAN_OPTIONS=halt_on_error=1:report_bugs=1:exitcode=99
          for t in 55_async_basic 56_async_await 57_real_await; do
            clang -O1 -g -fsanitize=thread -fno-omit-frame-pointer -no-pie \
                "/tmp/async/$t.s" /tmp/tsan_rt/libmapanare_rt_tsan.a \
                -lm -lpthread -ldl -o "/tmp/async/$t.bin"
            echo "=== $t ==="
            "/tmp/async/$t.bin"
          done

      # v4.117.0 Phase 2 extension: the v4.115.0 async demos exercise
      # real file I/O and real HTTP inside async pipelines (not just
      # the minimal block_on/await shape that goldens 55-57 cover).
      # Gate them under TSan too so any future race in the scheduler
      # or coroutine frame handling under I/O-heavy workloads fails
      # CI at PR time. `async_http_demo.mn` exits 0 cleanly if outbound
      # TCP is blocked; that's CI-safe by design.
      - name: TSan — v4.115.0 async I/O demos
        run: |
          export TSAN_OPTIONS=halt_on_error=1:report_bugs=1:exitcode=99
          mkdir -p /tmp/async_demos
          for demo in async_file_io async_http_demo; do
            python -m mapanare emit-llvm "examples/${demo}.mn" -o "/tmp/async_demos/${demo}.ll"
            clang -S -O1 "/tmp/async_demos/${demo}.ll" -o "/tmp/async_demos/${demo}.s"
            clang -O1 -g -fsanitize=thread -fno-omit-frame-pointer -no-pie \
                "/tmp/async_demos/${demo}.s" /tmp/tsan_rt/libmapanare_rt_tsan.a \
                -lm -lpthread -ldl -o "/tmp/async_demos/${demo}.bin"
            echo "=== ${demo} ==="
            timeout 20 "/tmp/async_demos/${demo}.bin" || {
              rc=$?
              # TSan exits 99 on race detection; any other non-zero is
              # a crash. async_http_demo is allowed to exit 0 when the
              # sandbox blocks TCP (it prints a deterministic message).
              if [ $rc -eq 99 ]; then
                echo "TSan race detected in ${demo} — FAIL"
                exit 1
              fi
              if [ "${demo}" = "async_http_demo" ] && [ $rc -eq 0 ]; then
                :
              else
                echo "${demo} exited ${rc} — FAIL"
                exit 1
              fi
            }
          done
