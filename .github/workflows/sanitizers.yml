name: sanitizers

# v4.105.0 Phase 5 — run valgrind + AddressSanitizer against the native
# compiler on every push/PR to `dev`. The valgrind job scans 64 golden
# tests; the ASan job runs the self-hosted compiler compiled with
# -fsanitize=address. The goal is regression prevention: any new
# memory-safety finding fails the build, surfacing the bug at PR time
# rather than months later. This CI is the permanent arm of what
# Phase 1-3 of v4.105.0 measured as one-off reports.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    name: valgrind (golden suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind clang llvm
          pip install -e ".[dev]"

      - name: Build mnc-stage1
        run: python scripts/build_stage1.py

      - name: Valgrind — full golden suite (documented baseline)
        # 36 of 64 tests have known pre-existing memory errors (see
        # docs/roadmap/v4/v4.105.0/VALGRIND_REPORT.md, docket items
        # Vg.1-Vg.7). This step records the CURRENT count and fails
        # the build if a new test regresses into ERRORS.
        run: |
          bash scripts/valgrind_all_goldens.sh
          python scripts/check_valgrind_baseline.py \
              /tmp/v4_105_valgrind/valgrind-summary.tsv \
              docs/roadmap/v4/v4.105.0/artifacts/valgrind-summary.tsv

      - name: Upload valgrind artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-${{ github.sha }}
          path: |
            /tmp/v4_105_valgrind/valgrind-summary.tsv
            /tmp/v4_105_valgrind/*.log
          retention-days: 14

  asan:
    name: AddressSanitizer (golden suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm
          pip install -e ".[dev]"

      - name: Build mnc-stage1 (normal) — produces main.ll
        run: python scripts/build_stage1.py

      - name: Build mnc-stage1-asan
        run: bash scripts/build_asan.sh

      - name: ASan — full golden suite with leak detection off
        # 17 of 64 tests have known ASan errors (see ASAN_REPORT.md,
        # docket items As.1-As.3). This step records the CURRENT count
        # and fails the build if a new test regresses into ASAN_ERROR.
        run: |
          bash scripts/run_asan_goldens.sh
          python scripts/check_asan_baseline.py \
              /tmp/v4_105_asan/asan-summary.tsv \
              docs/roadmap/v4/v4.105.0/artifacts/asan-summary.tsv

      - name: Upload ASan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-${{ github.sha }}
          path: |
            /tmp/v4_105_asan/asan-summary.tsv
            /tmp/v4_105_asan/*.err
          retention-days: 14

  tsan-async:
    name: ThreadSanitizer (async goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm
          pip install -e ".[dev]"

      - name: Build mnc-stage1 (normal)
        run: python scripts/build_stage1.py

      - name: Build TSan-instrumented libmapanare_rt.a
        run: |
          mkdir -p /tmp/tsan_rt
          for src in mapanare_core.c mapanare_io.c mapanare_runtime.c \
                     mapanare_gpu.c mapanare_gpu_builtins.c \
                     mapanare_db.c mapanare_html.c; do
            clang -c -O1 -g -fsanitize=thread -fno-omit-frame-pointer -fPIC \
                -I runtime/native \
                "-DMAPANARE_VERSION=\"$(cat VERSION)\"" \
                "runtime/native/$src" -o "/tmp/tsan_rt/${src%.c}.o"
          done
          ar rcs /tmp/tsan_rt/libmapanare_rt_tsan.a /tmp/tsan_rt/*.o

      - name: Compile async goldens to IR via bootstrap
        run: |
          mkdir -p /tmp/async
          for t in 55_async_basic 56_async_await 57_real_await; do
            python -m mapanare emit-llvm "tests/golden/$t.mn" -o "/tmp/async/$t.ll"
            llc "/tmp/async/$t.ll" -o "/tmp/async/$t.s"
          done

      - name: Link async goldens against TSan runtime and run them
        # v4.102.0 made these tests run natively; Phase 3 of v4.105.0
        # demonstrated 0 races. This CI gate enforces that permanent.
        run: |
          export TSAN_OPTIONS=halt_on_error=1:report_bugs=1:exitcode=99
          for t in 55_async_basic 56_async_await 57_real_await; do
            clang -O1 -g -fsanitize=thread -fno-omit-frame-pointer -no-pie \
                "/tmp/async/$t.s" /tmp/tsan_rt/libmapanare_rt_tsan.a \
                -lm -lpthread -ldl -o "/tmp/async/$t.bin"
            echo "=== $t ==="
            "/tmp/async/$t.bin"
          done

      # v4.117.0 Phase 2 extension: the v4.115.0 async demos exercise
      # real file I/O and real HTTP inside async pipelines (not just
      # the minimal block_on/await shape that goldens 55-57 cover).
      # Gate them under TSan too so any future race in the scheduler
      # or coroutine frame handling under I/O-heavy workloads fails
      # CI at PR time. `async_http_demo.mn` exits 0 cleanly if outbound
      # TCP is blocked; that's CI-safe by design.
      - name: TSan — v4.115.0 async I/O demos
        run: |
          export TSAN_OPTIONS=halt_on_error=1:report_bugs=1:exitcode=99
          mkdir -p /tmp/async_demos
          for demo in async_file_io async_http_demo; do
            python -m mapanare emit-llvm "examples/${demo}.mn" -o "/tmp/async_demos/${demo}.ll"
            llc "/tmp/async_demos/${demo}.ll" -o "/tmp/async_demos/${demo}.s"
            clang -O1 -g -fsanitize=thread -fno-omit-frame-pointer -no-pie \
                "/tmp/async_demos/${demo}.s" /tmp/tsan_rt/libmapanare_rt_tsan.a \
                -lm -lpthread -ldl -o "/tmp/async_demos/${demo}.bin"
            echo "=== ${demo} ==="
            timeout 20 "/tmp/async_demos/${demo}.bin" || {
              rc=$?
              # TSan exits 99 on race detection; any other non-zero is
              # a crash. async_http_demo is allowed to exit 0 when the
              # sandbox blocks TCP (it prints a deterministic message).
              if [ $rc -eq 99 ]; then
                echo "TSan race detected in ${demo} — FAIL"
                exit 1
              fi
              if [ "${demo}" = "async_http_demo" ] && [ $rc -eq 0 ]; then
                :
              else
                echo "${demo} exited ${rc} — FAIL"
                exit 1
              fi
            }
          done
