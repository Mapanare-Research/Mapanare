name = "mapanare-registry"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
GITHUB_CLIENT_ID = ""           # Set via wrangler secret
ALLOWED_PUBLISHERS = "Mapanare-Research"  # GitHub org — team-only for MVP

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "mapanare-packages"

[[kv_namespaces]]
binding = "TOKENS"
id = ""                          # Set after `wrangler kv:namespace create TOKENS`

[[kv_namespaces]]
binding = "PACKAGE_INDEX"
id = ""                          # Set after `wrangler kv:namespace create PACKAGE_INDEX`

[routes]
pattern = "registry.mapanare.dev/*"
